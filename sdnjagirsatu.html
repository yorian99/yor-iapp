<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN JAGIR 1 - Official Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll pada body utama */
        }
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background: #f3f4f6;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .menu-btn {
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .active-btn {
            color: #1e40af !important;
            font-weight: 700;
        }
        .active-btn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #3b82f6;
            border-radius: 2px;
        }
        /* Loading spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for nav */
        .nav-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div class="main-wrapper">
        <!-- Header / Navbar -->
        <header class="bg-white shadow-sm z-50 border-b border-gray-100">
            <div class="container mx-auto px-4 py-3 flex flex-col lg:flex-row items-center justify-between">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3 mb-3 lg:mb-0">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Lambang_Kabupaten_Ngawi.png" 
                         alt="Logo SDN JAGIR 1" 
                         class="h-12 w-auto object-contain"
                         onerror="this.src='https://placehold.co/100x120?text=LOGO'">
                    <div>
                        <h1 class="text-lg font-black text-blue-900 leading-none tracking-tight">SDN JAGIR 1</h1>
                        <p class="text-[9px] text-gray-500 uppercase tracking-[0.2em] mt-1 font-bold">Bangun Bangsa • Ngawi</p>
                    </div>
                </div>
                
                <!-- Navigation Links -->
                <nav class="flex items-center gap-4 lg:gap-7 overflow-x-auto w-full lg:w-auto nav-scroll pb-2 lg:pb-0">
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Beranda
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Tentang Kami
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Akademik
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Eskul
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Prestasi
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Berita
                    </button>
                    <button onclick="loadPage('https://www.yoriapp.site/jagirppdb', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-blue-600 hover:text-blue-800 transition-colors active-btn">
                        PPDB
                    </button>
                    <button onclick="loadPage('about:blank', this)" class="menu-btn text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-blue-700 transition-colors">
                        Kontak
                    </button>
                    
                    <button onclick="loadPage('https://www.yoriapp.site/jagirppdb', this)" class="bg-blue-900 text-white px-4 py-2 rounded text-[10px] font-black uppercase tracking-widest hover:bg-blue-800 transition-all shadow-sm">
                        Daftar
                    </button>
                </nav>
            </div>
        </header>

        <!-- Dynamic Status Info (Optional, minimal) -->
        <div class="bg-blue-50 px-4 py-1 flex items-center justify-between border-b border-blue-100">
            <div class="flex items-center gap-2">
                <div id="loader" class="loader"></div>
                <span id="page-title" class="text-[10px] font-bold text-blue-800 uppercase tracking-tighter">PPDB ONLINE</span>
            </div>
            <span class="text-[9px] text-blue-400 font-mono hidden sm:block">SDN JAGIR 1 OFFICIAL SYSTEM</span>
        </div>

        <!-- Full Page Iframe Content -->
        <div class="iframe-container">
            <iframe 
                id="main-frame" 
                src="https://www.yoriapp.site/jagirppdb" 
                onload="hideLoader()"
                title="Konten Utama Web Sekolah">
            </iframe>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        const loader = document.getElementById('loader');
        const pageTitleText = document.getElementById('page-title');

        function loadPage(url, btn) {
            loader.style.display = 'inline-block';
            iframe.src = url;

            const btnName = btn.innerText.trim();
            pageTitleText.innerText = btnName === 'DAFTAR' ? 'PPDB ONLINE' : btnName;

            document.querySelectorAll('.menu-btn').forEach(b => {
                b.classList.remove('active-btn');
            });
            
            if(btn.classList.contains('menu-btn')) {
                btn.classList.add('active-btn');
            }

            if (url === 'about:blank') {
                setTimeout(() => {
                    hideLoader();
                }, 400);
            }
        }

        function hideLoader() {
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
