<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cek Presensi Hari Ini - Korwil</title>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray: #94a3b8;
            --light: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4ff;
            color: var(--text);
            min-height: 100vh;
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 18px 20px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
        }
        .app-header .logo {
            width: 46px; height: 46px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
        }
        .app-header-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
        .app-header-text p  { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }
        .header-badge {
            margin-left: auto;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .date-strip {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .live-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite;
            margin-right: 6px;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .search-group { display: flex; gap: 10px; align-items: stretch; }
        .input-wrap { flex: 1; position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--gray); font-size: 0.95rem;
        }
        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s;
            background: var(--light);
            -webkit-appearance: none;
        }
        .input-wrap input:focus { outline: none; border-color: var(--primary); background: white; }
        .input-wrap input::placeholder { color: var(--gray); }
        .btn-cari {
            padding: 13px 20px;
            background: var(--primary);
            color: white; border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem; font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-cari:hover { background: var(--primary-dark); }
        .btn-cari:active { transform: scale(0.97); }
        .btn-cari.loading { opacity: 0.7; pointer-events: none; }
        #resultArea { display: none; }
        .pegawai-info {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px;
            background: var(--light);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .pegawai-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.3rem; flex-shrink: 0;
        }
        .pegawai-detail { flex: 1; min-width: 0; }
        .pegawai-nama { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pegawai-sub  { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .pegawai-nip  {
            font-size: 0.7rem; color: var(--primary); font-weight: 600;
            background: #eff2ff; padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
        }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
        .status-card { border-radius: 14px; overflow: hidden; border: 2px solid transparent; transition: border-color 0.2s; }
        .status-card.has-record { border-color: var(--success); }
        .status-card.no-record  { border-color: var(--border); }
        .status-card-header {
            padding: 12px 14px 10px;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; font-weight: 600;
        }
        .status-card.datang .status-card-header { background: linear-gradient(135deg, #dbeafe, #eff6ff); color: #1d4ed8; }
        .status-card.pulang .status-card-header { background: linear-gradient(135deg, #f3e8ff, #faf5ff); color: #7e22ce; }
        .status-card-body { padding: 12px 14px; background: white; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
        }
        .status-badge.recorded     { background: #dcfce7; color: #15803d; }
        .status-badge.not-recorded { background: #f1f5f9; color: #64748b; }
        .record-time  { margin-top: 8px; font-size: 0.82rem; color: var(--text); font-weight: 600; }
        .record-time span { color: var(--success); }
        .record-location {
            margin-top: 4px; font-size: 0.7rem; color: var(--text-secondary);
            display: flex; align-items: center; gap: 4px; line-height: 1.4;
        }
        .btn-lihat-foto {
            margin-top: 10px; width: 100%; padding: 8px;
            background: var(--primary); color: white; border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 0.78rem; font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: background 0.2s;
        }
        .btn-lihat-foto:hover { background: var(--primary-dark); }
        .btn-lihat-foto.pulang-btn { background: #7e22ce; }
        .btn-lihat-foto.pulang-btn:hover { background: #6d28d9; }
        .summary-strip {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 12px;
            font-size: 0.82rem; font-weight: 500;
        }
        .summary-strip.complete { background: #dcfce7; color: #15803d; }
        .summary-strip.partial  { background: #fef9c3; color: #92400e; }
        .summary-strip.none     { background: #fee2e2; color: #991b1b; }
        .summary-strip i { font-size: 1.2rem; }
        .not-found { text-align: center; padding: 30px 20px; }
        .not-found i { font-size: 3rem; color: var(--gray); margin-bottom: 12px; display: block; }
        .not-found p { color: var(--text-secondary); font-size: 0.9rem; }
        .not-found strong { display: block; font-size: 1rem; color: var(--text); margin-bottom: 6px; }
        .rekap-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px dashed var(--border);
            font-size: 0.82rem;
        }
        .rekap-row:last-child { border-bottom: none; }
        .rekap-label { color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
        .rekap-val { font-weight: 600; }
        .rekap-val.ok   { color: var(--success); }
        .rekap-val.warn { color: var(--warning); }
        .rekap-val.miss { color: var(--danger); }
        .alert-error {
            background: #fee2e2; border-left: 4px solid var(--danger);
            padding: 12px 16px; border-radius: 0 10px 10px 0;
            font-size: 0.85rem; color: #991b1b;
            display: flex; align-items: flex-start; gap: 10px;
        }
        .info-box {
            background: #eff6ff; border-left: 4px solid var(--primary);
            padding: 12px 16px; border-radius: 0 10px 10px 0;
            font-size: 0.8rem; color: #1e40af;
            display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;
            margin-top: 12px;
        }
        .info-box i { flex-shrink: 0; margin-top: 2px; }
        #fotoModal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 1000; display: none;
            align-items: center; justify-content: center;
            padding: 16px;
            backdrop-filter: blur(6px);
        }
        #fotoModal.show { display: flex; }
        .foto-modal-inner {
            background: white; border-radius: 20px;
            width: 100%; max-width: 400px; overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px) scale(0.95); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }
        .foto-modal-header {
            padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .foto-modal-header h3 { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .foto-modal-header h3 i { color: var(--primary); }
        .btn-close-modal {
            background: var(--light); border: none;
            width: 34px; height: 34px; border-radius: 50%;
            cursor: pointer; font-size: 1rem; color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .btn-close-modal:hover { background: var(--border); }
        .foto-modal-body { padding: 16px; }
        .foto-meta {
            display: flex; justify-content: space-between;
            margin-bottom: 12px; font-size: 0.78rem; color: var(--text-secondary);
        }
        .foto-meta strong { color: var(--text); }
        .foto-container {
            border-radius: 14px; overflow: hidden;
            background: #0f172a; position: relative; min-height: 120px;
        }
        .foto-container img { width: 100%; display: block; max-height: 380px; object-fit: cover; }
        .foto-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0f172a; color: white; font-size: 0.85rem;
            flex-direction: column; gap: 10px;
        }
        .foto-loading i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .foto-modal-footer {
            padding: 14px 16px; border-top: 1px solid var(--border);
        }
        .btn-tutup {
            width: 100%; padding: 11px;
            background: var(--light); color: var(--text);
            border: none; border-radius: 10px;
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-tutup:hover { background: var(--border); }
        .bottom-note { text-align: center; font-size: 0.7rem; color: var(--gray); margin-top: 8px; line-height: 1.5; }
        .status-radius {
            margin-top: 4px; font-size: 0.7rem;
            padding: 2px 8px; border-radius: 10px; display: inline-block;
        }
        .status-radius.dalam { background: #dcfce7; color: #15803d; }
        .status-radius.luar  { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div class="app-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/500px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png"
             alt="Logo" class="logo">
        <div class="app-header-text">
            <h1>Cek Presensi Hari Ini</h1>
            <p>Korwil Kecamatan &middot; Tahun 2026</p>
        </div>
        <div class="header-badge">
            <i class="fas fa-calendar-check" style="margin-right:5px;"></i>
            <span id="headerTanggal">–</span>
        </div>
    </div>

    <div class="date-strip">
        <span><span class="live-dot"></span><span id="stripHari">–</span></span>
        <span id="stripJam" style="font-weight:600; color:var(--primary);">00:00:00 WIB</span>
    </div>

    <div class="container">

        <!-- CARI NIP -->
        <div class="card">
            <div class="card-label"><i class="fas fa-search"></i> Cari Presensi Pegawai</div>
            <div class="search-group">
                <div class="input-wrap">
                    <i class="fas fa-id-badge"></i>
                    <input type="text" id="nipInput"
                           placeholder="Masukkan Username / NIP..."
                           autocomplete="off" autocorrect="off" spellcheck="false">
                </div>
                <button class="btn-cari" id="btnCari" onclick="cariPresensi()">
                    <i class="fas fa-search"></i> Cari
                </button>
            </div>
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <span>Masukkan <strong>username</strong> pegawai untuk melihat status presensi <strong>Datang</strong> dan <strong>Pulang</strong> hari ini beserta foto selfie.</span>
            </div>
        </div>

        <!-- HASIL -->
        <div id="resultArea">
            <div class="card" id="cardPegawai"></div>
            <div class="card" id="cardStatus" style="display:none;"></div>
            <div class="card" id="cardRekap"  style="display:none;"></div>
        </div>

    </div>

    <!-- MODAL FOTO -->
    <div id="fotoModal">
        <div class="foto-modal-inner">
            <div class="foto-modal-header">
                <h3><i class="fas fa-camera"></i> <span id="modalTitle">Foto Presensi</span></h3>
                <button class="btn-close-modal" onclick="tutupFoto()"><i class="fas fa-times"></i></button>
            </div>
            <div class="foto-modal-body">
                <div class="foto-meta">
                    <strong id="modalNama">–</strong>
                    <span id="modalWaktu">–</span>
                </div>
                <div class="foto-container" id="fotoContainer">
                    <div class="foto-loading" id="fotoLoading">
                        <i class="fas fa-circle-notch"></i>
                        <span>Memuat foto...</span>
                    </div>
                    <img id="fotoImg" src="" alt="Foto Presensi"
                         style="display:none;"
                         onload="fotoLoaded()" onerror="fotoError()">
                </div>
                <div style="margin-top:10px; font-size:0.75rem; color:var(--text-secondary); line-height:1.5;">
                    <i class="fas fa-map-marker-alt" style="color:var(--primary);"></i>
                    <span id="modalLokasi">–</span>
                    &nbsp;|&nbsp;
                    <i class="fas fa-ruler-combined" style="color:var(--primary);"></i>
                    <span id="modalJarak">–</span>
                </div>
            </div>
            <div class="foto-modal-footer">
                <button class="btn-tutup" onclick="tutupFoto()">
                    <i class="fas fa-times"></i> Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        // ── GANTI dengan URL Apps Script Anda ──────────────────────────────
        const APPS_SCRIPT_URL = 'GANTI_DENGAN_URL_APPS_SCRIPT_ANDA';
        // ───────────────────────────────────────────────────────────────────

        const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        const BULAN = ['Januari','Februari','Maret','April','Mei','Juni',
                       'Juli','Agustus','September','Oktober','November','Desember'];

        function getWIB() {
            const n = new Date();
            return new Date(n.getTime() + n.getTimezoneOffset()*60000 + 25200000);
        }
        function fmtJam(d) {
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')} WIB`;
        }
        function fmtTgl(d) {
            return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
        }
        function fmtTglShort(d) {
            return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
        }

        function updateClock() {
            const w = getWIB();
            document.getElementById('headerTanggal').textContent = `${w.getDate()} ${BULAN[w.getMonth()]}`;
            document.getElementById('stripHari').textContent = fmtTgl(w);
            document.getElementById('stripJam').textContent  = fmtJam(w);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Enter key
        document.getElementById('nipInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') cariPresensi();
        });

        function setLoading(on) {
            const b = document.getElementById('btnCari');
            b.classList.toggle('loading', on);
            b.innerHTML = on
                ? '<i class="fas fa-circle-notch fa-spin"></i> Mencari...'
                : '<i class="fas fa-search"></i> Cari';
        }

        // ── POST ke Apps Script ─────────────────────────────────────────────
        async function post(action, payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...payload })
            });
            if (!res.ok) throw new Error('HTTP error ' + res.status);
            return res.json();
        }

        // ── Ambil tanggal hari ini WIB (yyyy-MM-dd) ─────────────────────────
        function tanggalHariIni() {
            const w = getWIB();
            return `${w.getFullYear()}-${(w.getMonth()+1).toString().padStart(2,'0')}-${w.getDate().toString().padStart(2,'0')}`;
        }

        // ── CARI PRESENSI ────────────────────────────────────────────────────
        async function cariPresensi() {
            const username = document.getElementById('nipInput').value.trim();
            if (!username) { alert('Masukkan username pegawai terlebih dahulu.'); return; }

            setLoading(true);
            document.getElementById('resultArea').style.display = 'none';

            try {
                const result = await post('getPresensiHariIni', {
                    username: username,
                    tanggal: tanggalHariIni()
                });

                if (result.error === 'not_found') {
                    renderNotFound(username);
                } else {
                    renderResult(result);
                }
            } catch (err) {
                renderError(err.message);
            }
            setLoading(false);
        }

        // ── RENDER HASIL ─────────────────────────────────────────────────────
        function renderResult(data) {
            const wib = getWIB();

            // --- Card: Identitas pegawai ---
            const cp = document.getElementById('cardPegawai');
            cp.innerHTML = `
                <div class="card-label"><i class="fas fa-id-card"></i> Identitas Pegawai</div>
                <div class="pegawai-info">
                    <div class="pegawai-avatar"><i class="fas fa-user-tie"></i></div>
                    <div class="pegawai-detail">
                        <div class="pegawai-nama">${esc(data.namaPegawai)}</div>
                        <div class="pegawai-sub">${esc(data.namaLembaga)}</div>
                    </div>
                    <div class="pegawai-nip">${esc(data.username)}</div>
                </div>`;

            // --- Card: Status datang & pulang ---
            const isFri = getWIB().getDay() === 5;
            const cs = document.getElementById('cardStatus');
            cs.innerHTML = `
                <div class="card-label"><i class="fas fa-clipboard-check"></i> Status Presensi – ${fmtTglShort(wib)}</div>
                <div class="status-grid">
                    ${buildStatusCard('datang', data.datang, '06:00 – 07:00', data.namaPegawai)}
                    ${buildStatusCard('pulang', data.pulang, isFri ? '14:30 – 16:30' : '15:00 – 16:30', data.namaPegawai)}
                </div>`;
            cs.style.display = 'block';

            // --- Card: Ringkasan ---
            const d = data.datang, p = data.pulang;
            let sc, si, st;
            if (d && p) {
                sc='complete'; si='fas fa-check-circle';
                st='Presensi hari ini <strong>lengkap</strong>. Datang dan pulang sudah terekam.';
            } else if (d || p) {
                sc='partial'; si='fas fa-exclamation-circle';
                st = d
                    ? 'Presensi <strong>datang</strong> sudah terekam. Presensi <strong>pulang</strong> belum.'
                    : 'Presensi <strong>pulang</strong> terekam, namun <strong>datang</strong> belum.';
            } else {
                sc='none'; si='fas fa-times-circle';
                st='Presensi hari ini <strong>belum ada</strong>. Datang dan pulang belum terekam.';
            }

            const cr = document.getElementById('cardRekap');
            cr.innerHTML = `
                <div class="card-label"><i class="fas fa-chart-bar"></i> Ringkasan Hari Ini</div>
                <div class="summary-strip ${sc}" style="margin-bottom:14px;">
                    <i class="${si}"></i><span>${st}</span>
                </div>
                <div class="rekap-row">
                    <span class="rekap-label"><i class="fas fa-sign-in-alt" style="color:#3b82f6;"></i> Jam Datang</span>
                    <span class="rekap-val ${d ? 'ok' : 'miss'}">${d ? esc(d.jam) : '–'}</span>
                </div>
                <div class="rekap-row">
                    <span class="rekap-label"><i class="fas fa-sign-out-alt" style="color:#7c3aed;"></i> Jam Pulang</span>
                    <span class="rekap-val ${p ? 'ok' : 'miss'}">${p ? esc(p.jam) : '–'}</span>
                </div>
                <div class="rekap-row">
                    <span class="rekap-label"><i class="fas fa-ruler-combined" style="color:#0891b2;"></i> Jarak Datang</span>
                    <span class="rekap-val ${d ? (parseFloat(d.jarak) > 0 ? 'warn' : 'ok') : 'miss'}">${d ? esc(d.jarak) + ' m' : '–'}</span>
                </div>
                <div class="rekap-row">
                    <span class="rekap-label"><i class="fas fa-ruler-combined" style="color:#0891b2;"></i> Jarak Pulang</span>
                    <span class="rekap-val ${p ? (parseFloat(p.jarak) > 0 ? 'warn' : 'ok') : 'miss'}">${p ? esc(p.jarak) + ' m' : '–'}</span>
                </div>
                <div class="rekap-row">
                    <span class="rekap-label"><i class="fas fa-camera" style="color:#0891b2;"></i> Foto Selfie</span>
                    <span class="rekap-val">
                        ${d?.fotoUrl ? '<span style="color:var(--success);">✓ Datang</span>' : ''}
                        ${d?.fotoUrl && p?.fotoUrl ? ' &amp; ' : ''}
                        ${p?.fotoUrl ? '<span style="color:var(--success);">✓ Pulang</span>' : ''}
                        ${!d?.fotoUrl && !p?.fotoUrl ? '<span style="color:var(--gray);">–</span>' : ''}
                    </span>
                </div>
                <p class="bottom-note" style="margin-top:12px;">
                    <i class="fas fa-sync-alt"></i> Dicek pada: ${fmtJam(wib)}
                </p>`;
            cr.style.display = 'block';

            document.getElementById('resultArea').style.display = 'block';
        }

        function buildStatusCard(tipe, rec, jamSlot, nama) {
            const isDatang = tipe === 'datang';
            const label = isDatang ? 'Datang' : 'Pulang';
            const icon  = isDatang ? 'fas fa-sign-in-alt' : 'fas fa-sign-out-alt';

            if (rec) {
                const lokasiStr = (rec.latitude && rec.longitude)
                    ? `${String(rec.latitude).substring(0,9)}, ${String(rec.longitude).substring(0,10)}`
                    : '–';
                const fotoBtn = rec.fotoUrl
                    ? `<button class="btn-lihat-foto ${isDatang ? '' : 'pulang-btn'}"
                              onclick="lihatFoto('${esc(tipe)}','${esc(rec.fotoUrl)}','${esc(nama)}','${esc(rec.jam)}','${esc(lokasiStr)}','${esc(rec.jarak)}')">
                           <i class="fas fa-image"></i> Lihat Foto
                       </button>`
                    : `<div style="margin-top:10px;font-size:0.72rem;color:var(--gray);"><i class="fas fa-image"></i> Foto tidak tersedia</div>`;

                const radiusClass = rec.statusRadius === 'DI DALAM RADIUS' ? 'dalam' : 'luar';
                const radiusLabel = rec.statusRadius === 'DI DALAM RADIUS' ? '✓ Dalam Radius' : '⚠ Luar Radius';

                return `
                    <div class="status-card ${tipe} has-record">
                        <div class="status-card-header"><i class="${icon}"></i> ${label}</div>
                        <div class="status-card-body">
                            <div class="status-badge recorded"><i class="fas fa-check-circle"></i> Terekam</div>
                            <div class="record-time">
                                <i class="fas fa-clock" style="font-size:.75rem;color:var(--success);margin-right:3px;"></i>
                                <span>${esc(rec.jam)}</span>
                            </div>
                            <div class="record-location">
                                <i class="fas fa-map-marker-alt" style="color:var(--primary);flex-shrink:0;"></i>
                                ${esc(lokasiStr)}
                            </div>
                            <div><span class="status-radius ${radiusClass}">${radiusLabel}</span></div>
                            ${fotoBtn}
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="status-card ${tipe} no-record">
                        <div class="status-card-header"><i class="${icon}"></i> ${label}</div>
                        <div class="status-card-body">
                            <div class="status-badge not-recorded"><i class="fas fa-minus-circle"></i> Belum</div>
                            <div style="margin-top:8px;font-size:.75rem;color:var(--text-secondary);line-height:1.4;">
                                <i class="fas fa-clock" style="margin-right:3px;"></i>${jamSlot}
                            </div>
                        </div>
                    </div>`;
            }
        }

        function renderNotFound(username) {
            document.getElementById('cardPegawai').innerHTML = `
                <div style="text-align:center;padding:30px 10px;">
                    <i class="fas fa-user-slash" style="font-size:3rem;color:var(--gray);display:block;margin-bottom:12px;"></i>
                    <strong style="font-size:1rem;">Username Tidak Ditemukan</strong>
                    <p style="color:var(--text-secondary);font-size:.9rem;margin-top:6px;">
                        Username <strong>${esc(username)}</strong> tidak ada di sistem. Periksa kembali.
                    </p>
                </div>`;
            document.getElementById('cardStatus').style.display = 'none';
            document.getElementById('cardRekap').style.display  = 'none';
            document.getElementById('resultArea').style.display = 'block';
        }

        function renderError(msg) {
            document.getElementById('cardPegawai').innerHTML = `
                <div class="alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Gagal mengambil data: <strong>${esc(msg)}</strong>. Coba beberapa saat lagi.</span>
                </div>`;
            document.getElementById('cardStatus').style.display = 'none';
            document.getElementById('cardRekap').style.display  = 'none';
            document.getElementById('resultArea').style.display = 'block';
        }

        // ── MODAL FOTO ───────────────────────────────────────────────────────
        function lihatFoto(tipe, fotoUrl, nama, jam, lokasi, jarak) {
            document.getElementById('modalTitle').textContent = tipe === 'datang' ? 'Foto Presensi Datang' : 'Foto Presensi Pulang';
            document.getElementById('modalNama').textContent  = nama;
            document.getElementById('modalWaktu').textContent = jam;
            document.getElementById('modalLokasi').textContent = lokasi;
            document.getElementById('modalJarak').textContent  = jarak ? jarak + ' m dari lembaga' : '–';

            const img = document.getElementById('fotoImg');
            document.getElementById('fotoLoading').style.display = 'flex';
            img.style.display = 'none';

            // Konversi Google Drive URL ke thumbnail langsung
            img.src = driveThumbnailUrl(fotoUrl);

            document.getElementById('fotoModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // Google Drive: ubah ke format thumbnail/preview yang bisa ditampilkan di <img>
        function driveThumbnailUrl(url) {
            if (!url) return '';
            // Format: https://drive.google.com/file/d/FILE_ID/view
            const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w600`;
            // Format: https://drive.google.com/open?id=FILE_ID
            const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (m2) return `https://drive.google.com/thumbnail?id=${m2[1]}&sz=w600`;
            return url;
        }

        function fotoLoaded() {
            document.getElementById('fotoImg').style.display = 'block';
            document.getElementById('fotoLoading').style.display = 'none';
        }
        function fotoError() {
            document.getElementById('fotoLoading').innerHTML =
                '<i class="fas fa-image" style="color:#94a3b8;"></i><span style="color:#94a3b8;font-size:.8rem;">Foto tidak dapat dimuat</span>';
        }
        function tutupFoto() {
            document.getElementById('fotoModal').classList.remove('show');
            document.body.style.overflow = '';
            setTimeout(() => { document.getElementById('fotoImg').src = ''; }, 300);
        }
        document.getElementById('fotoModal').addEventListener('click', function(e) {
            if (e.target === this) tutupFoto();
        });

        function esc(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }
    </script>
</body>
</html>
