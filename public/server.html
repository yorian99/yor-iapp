<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoriAPP — Server Panel</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/yorian99/yor-iapp/83963469a2d61d52405349d6039f1648edd93c6d/favicon.png">
<style>
  /* ── Tokens ─────────────────────────────────────────── */
  :root {
    --bg:        #f4f5f7;
    --surface:   #ffffff;
    --card:      #f9fafb;
    --border:    #e2e6ea;
    --border-2:  #c8d0da;
    --text:      #1a1d23;
    --text-2:    #5a6170;
    --text-3:    #8a93a0;
    --blue:      #2563eb;
    --blue-lt:   #eff4ff;
    --blue-dk:   #1d4ed8;
    --green:     #16a34a;
    --green-lt:  #f0fdf4;
    --red:       #dc2626;
    --red-lt:    #fef2f2;
    --amber:     #d97706;
    --amber-lt:  #fffbeb;
    --matrix:    #2563eb14;
    --mono:      'JetBrains Mono', 'Courier New', monospace;
    --sans:      'Inter', system-ui, sans-serif;
    --r:         10px;
    --r-sm:      6px;
    --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Matrix ambient ──────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--matrix) 1px, transparent 1px),
      linear-gradient(90deg, var(--matrix) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ──────────────────────────────────────────── */
  #app { position: relative; z-index: 1; }

  /* ── Login ───────────────────────────────────────────── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    background: var(--blue);
    border-radius: var(--r);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: -1px;
  }

  .brand-text h1 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 12px;
    color: var(--text-3);
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: .35rem;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 1.75rem;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  input[type=text], input[type=password], input[type=date], input[type=url], select, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-size: 14px;
    font-family: var(--sans);
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    background: #fff;
  }

  .form-group { margin-bottom: 1rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .15s;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .btn-primary:hover { background: var(--blue-dk); border-color: var(--blue-dk); }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border-color: var(--border-2);
  }
  .btn-outline:hover { background: var(--card); border-color: var(--blue); color: var(--blue); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border-color: #fecaca;
  }
  .btn-danger:hover { background: var(--red-lt); }

  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }

  .err-msg {
    background: var(--red-lt);
    color: var(--red);
    border: 1px solid #fecaca;
    border-radius: var(--r-sm);
    padding: 9px 12px;
    font-size: 13px;
    margin-bottom: 1rem;
    display: none;
  }

  /* ── Main App ────────────────────────────────────────── */
  #mainApp { display: none; min-height: 100vh; }

  /* Topbar */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .topbar-brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .topbar-brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(.85); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .3px;
    text-transform: uppercase;
  }

  .badge-blue { background: var(--blue-lt); color: var(--blue); }
  .badge-green { background: var(--green-lt); color: var(--green); }
  .badge-red { background: var(--red-lt); color: var(--red); }
  .badge-amber { background: var(--amber-lt); color: var(--amber); }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px 4px 6px;
    font-size: 13px;
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--mono);
  }

  /* Content */
  .content {
    padding: 1.5rem;
    max-width: 1300px;
    margin: 0 auto;
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
  }

  .stat-label { font-size: 12px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--text); font-family: var(--mono); margin-top: 2px; }
  .stat-val.blue { color: var(--blue); }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--red); }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap input {
    padding-left: 34px;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    font-size: 15px;
    pointer-events: none;
  }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead {
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: .5px;
    white-space: nowrap;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #f1f3f5;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }

  tr:hover td { background: #f8f9ff; }

  .server-name {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
  }

  .server-type {
    font-size: 11px;
    color: var(--text-3);
    font-family: var(--mono);
    margin-top: 1px;
  }

  .link-cell a {
    color: var(--blue);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .link-cell a:hover { text-decoration: underline; }

  .action-btns { display: flex; gap: 6px; align-items: center; }

  .toggle-btn {
    width: 38px;
    height: 20px;
    border-radius: 20px;
    background: #e5e7eb;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background .2s;
  }

  .toggle-btn.on { background: var(--green); }

  .toggle-btn::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: left .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }

  .toggle-btn.on::after { left: 21px; }

  .date-range {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-2);
  }

  .date-expired {
    color: var(--red);
    font-weight: 600;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-3);
  }

  .empty-icon { font-size: 48px; margin-bottom: 1rem; }
  .empty-state p { font-size: 15px; }

  /* ── Modal ───────────────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,30,.45);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    display: none;
  }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }

  .modal-header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title { font-size: 16px; font-weight: 700; }

  .modal-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 20px;
    color: var(--text-3);
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .modal-close:hover { background: var(--card); color: var(--text); }

  .modal-body { padding: 1.5rem; }

  .modal-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* ── Loading / Toast ─────────────────────────────────── */
  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--r);
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all .25s;
    max-width: 320px;
    box-shadow: var(--shadow-lg);
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.ok { background: var(--green); }
  #toast.err { background: var(--red); }

  /* ── Sapa banner ─────────────────────────────────────── */
  .sapa-banner {
    background: linear-gradient(135deg, var(--blue) 0%, #1e40af 100%);
    color: #fff;
    border-radius: var(--r);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
  }

  .sapa-icon { font-size: 22px; }

  .matrix-tag {
    font-family: var(--mono);
    font-size: 11px;
    background: rgba(255,255,255,.15);
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: auto;
    letter-spacing: .5px;
  }

  /* ── Responsive ──────────────────────────────────────── */
  @media (max-width: 700px) {
    .form-row { grid-template-columns: 1fr; }
    .topbar { padding: 0 1rem; }
    .content { padding: 1rem; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ═══ LOGIN ═══════════════════════════════════════════ -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="brand">
        <img src="https://raw.githubusercontent.com/yorian99/yor-iapp/83963469a2d61d52405349d6039f1648edd93c6d/favicon.png" class="brand-icon" style="border-radius:10px;width:40px;height:40px;object-fit:cover;background:var(--blue);" onerror="this.outerHTML='<div class=&quot;brand-icon&quot;>Y/</div>'">
        <div class="brand-text">
          <h1>YoriAPP</h1>
          <p>Server Management Panel</p>
        </div>
      </div>

      <h2 class="login-title">Masuk</h2>
      <p class="login-sub">Masukkan kredensial akun kamu</p>

      <div id="loginErr" class="err-msg"></div>

      <div class="form-group">
        <label>User ID</label>
        <input type="text" id="userId" placeholder="Contoh: YORI" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">
        Masuk ke Panel
      </button>
    </div>
  </div>

  <!-- ═══ MAIN APP ═════════════════════════════════════════ -->
  <div id="mainApp">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">
          <div class="dot"></div>
          YoriAPP Panel
        </div>
        <span class="badge badge-blue" id="roleTag">ADMIN</span>
      </div>
      <div class="topbar-right">
        <div class="user-pill">
          <div class="avatar" id="avatarEl">YR</div>
          <span id="userLabel" style="font-size:13px; font-weight:600;"></span>
        </div>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Sapa -->
      <div class="sapa-banner" id="sapaBanner">
        <span class="sapa-icon">👋</span>
        <span id="sapaText">Selamat datang!</span>
        <span class="matrix-tag" id="roleLabel">ADMIN</span>
      </div>

      <!-- Stats -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-label">Total Server</div>
          <div class="stat-val blue" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Aktif</div>
          <div class="stat-val green" id="statAktif">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Nonaktif</div>
          <div class="stat-val red" id="statNonaktif">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Masa Habis</div>
          <div class="stat-val" id="statExpired" style="color:var(--amber)">0</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Cari nama server..." oninput="renderTable()">
        </div>
        <select id="filterStatus" onchange="renderTable()" style="width:140px;">
          <option value="">Semua Status</option>
          <option value="AKTIF">Aktif</option>
          <option value="NONAKTIF">Nonaktif</option>
        </select>
        <button class="btn btn-primary" id="addBtn" onclick="openModal()" style="display:none;">
          + Tambah Server
        </button>
        <button class="btn btn-outline btn-sm" onclick="loadServers()">↻ Refresh</button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

    </div><!-- /content -->
  </div><!-- /mainApp -->

</div><!-- /app -->

<!-- ═══ MODAL TAMBAH/EDIT ════════════════════════════════ -->
<div class="overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Tambah Server</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label>Nama Proyek *</label>
          <input type="text" id="fNama" placeholder="PRESENSI SINE">
        </div>
        <div class="form-group">
          <label>Jenis</label>
          <input type="text" id="fJenis" placeholder="Presensi / Absensi">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Server / Platform</label>
          <input type="text" id="fServer" placeholder="PRESENSI-AP">
        </div>
        <div class="form-group">
          <label>Domain</label>
          <input type="url" id="fDomain" placeholder="https://sineabsen.sdnegeri...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Akun Git</label>
          <input type="text" id="fAkunGit" placeholder="yor-kt">
        </div>
        <div class="form-group">
          <label>Repo GitHub</label>
          <input type="url" id="fRepo" placeholder="https://github.com/yor-kt/...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Link DB (Spreadsheet)</label>
          <input type="url" id="fDb" placeholder="https://docs.google.com/...">
        </div>
        <div class="form-group">
          <label>Link Backend (GAS)</label>
          <input type="url" id="fLinkBackend" placeholder="https://drive.google.com/...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tanggal Aktif Mulai</label>
          <input type="date" id="fTglMulai">
        </div>
        <div class="form-group">
          <label>Tanggal Aktif Akhir</label>
          <input type="date" id="fTglAkhir">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="AKTIF">Aktif</option>
          <option value="NONAKTIF">Nonaktif</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveServer()">Simpan</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// KONFIGURASI — Ganti URL ini setelah deploy Google Apps Script
// ═══════════════════════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbx-RIHXbXDKHozQz_o_tELfQuJlyA742mSAN8KJtgTqc0aNXChMxmCGFwQZd616Mw/exec';
// Contoh: 'https://script.google.com/macros/s/AKfycb.../exec'

// ─── State ──────────────────────────────────────────────────
let session  = null;
let servers  = [];
let editMode = false;

// ─── Init ───────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !session) doLogin();
  if (e.key === 'Escape') closeModal();
});

// ─── API Helper ─────────────────────────────────────────────
// GAS hanya bisa diakses via GET dengan JSONP atau iframe trick
// Solusi: pakai fetch dengan redirect:follow — GAS auto CORS saat deploy "Anyone"
async function api(action, params = {}) {
  const flat = {};
  for (const k in params) {
    const v = params[k];
    flat[k] = (v === null || v === undefined) ? '' : String(v);
  }
  const qs = new URLSearchParams({
    action,
    token: session?.token || '',
    ...flat,
  });
  const url = API + '?' + qs;
  try {
    // Coba fetch biasa dulu (works jika deploy benar)
    const r = await fetch(url, {
      method: 'GET',
      redirect: 'follow',
    });
    const text = await r.text();
    try {
      return JSON.parse(text);
    } catch(_) {
      return { ok: false, msg: 'Response bukan JSON. Cek GAS deployment.' };
    }
  } catch (e) {
    // Fallback: coba via JSONP
    return new Promise((resolve) => {
      const cbName = '_gasCallback_' + Date.now();
      const script = document.createElement('script');
      const timer  = setTimeout(() => {
        delete window[cbName];
        document.head.removeChild(script);
        resolve({ ok: false, msg: 'Timeout. Pastikan GAS deploy dengan akses "Anyone".' });
      }, 10000);
      window[cbName] = (data) => {
        clearTimeout(timer);
        delete window[cbName];
        document.head.removeChild(script);
        resolve(data);
      };
      script.src = url + '&callback=' + cbName;
      document.head.appendChild(script);
    });
  }
}

async function apiGet(params) {
  const { action, ...rest } = params;
  return api(action, rest);
}

// ─── Auth ───────────────────────────────────────────────────
async function doLogin() {
  const userId   = document.getElementById('userId').value.trim();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('loginErr');
  const btn      = document.getElementById('loginBtn');

  if (!userId || !password) {
    showErr(errEl, 'User ID dan Password wajib diisi');
    return;
  }

  btn.innerHTML = '<span class="loader"></span> Memverifikasi...';
  btn.disabled  = true;
  errEl.style.display = 'none';

  const res = await api('login', { userId, password });

  btn.innerHTML = 'Masuk ke Panel';
  btn.disabled  = false;

  if (!res.ok) {
    showErr(errEl, res.msg || 'Login gagal');
    return;
  }

  session = { token: res.token, role: res.role, userId: res.userId, sapa: res.sapa };
  initApp();
}

function doLogout() {
  session = null;
  servers = [];
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('userId').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginErr').style.display = 'none';
}

// ─── App Init ───────────────────────────────────────────────
function initApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';

  const initial = session.userId.slice(0, 2).toUpperCase();
  document.getElementById('avatarEl').textContent  = initial;
  document.getElementById('userLabel').textContent  = session.userId;
  document.getElementById('sapaText').textContent   = session.sapa || ('Selamat datang, ' + session.userId + '!');
  document.getElementById('roleTag').textContent    = session.role;
  document.getElementById('roleLabel').textContent  = session.role;

  const isAdmin = session.role === 'ADMIN';
  document.getElementById('addBtn').style.display = isAdmin ? '' : 'none';

  renderHead();
  loadServers();
}

// ─── Load & Render ───────────────────────────────────────────
async function loadServers() {
  const body = document.getElementById('tableBody');
  body.innerHTML = '<tr><td colspan="20" style="text-align:center;padding:2rem;color:var(--text-3);">Memuat data...</td></tr>';

  const res = await apiGet({ action: 'getServers' });
  if (!res.ok) { toast(res.msg || 'Gagal memuat', 'err'); return; }

  servers = res.servers || [];
  updateStats();
  renderTable();
}

function updateStats() {
  const today   = new Date(); today.setHours(0,0,0,0);
  const total   = servers.length;
  const aktif   = servers.filter(s => s.status === 'AKTIF').length;
  const nonaktif= total - aktif;
  const expired = servers.filter(s => {
    if (!s.tglAkhir) return false;
    return new Date(s.tglAkhir) < today;
  }).length;

  document.getElementById('statTotal').textContent   = total;
  document.getElementById('statAktif').textContent   = aktif;
  document.getElementById('statNonaktif').textContent= nonaktif;
  document.getElementById('statExpired').textContent  = expired;
}

function renderHead() {
  const isAdmin = session?.role === 'ADMIN';
  const adminCols = isAdmin
    ? '<th>Domain</th><th>Repo</th><th>DB</th><th>Backend</th><th>Rentang Aktif</th><th>Aksi</th>'
    : '<th>Rentang Aktif</th>';
  document.getElementById('tableHead').innerHTML = `
    <tr>
      <th>#</th>
      <th>Server</th>
      <th>Status</th>
      ${adminCols}
    </tr>
  `;
}

function renderTable() {
  const q      = (document.getElementById('searchInput').value || '').toLowerCase();
  const fStat  = document.getElementById('filterStatus').value;
  const isAdmin= session?.role === 'ADMIN';
  const today  = new Date(); today.setHours(0,0,0,0);

  const filtered = servers.filter(s => {
    const matchQ    = !q || s.nama.toLowerCase().includes(q) || (s.jenis||'').toLowerCase().includes(q);
    const matchStat = !fStat || s.status === fStat;
    return matchQ && matchStat;
  });

  const body = document.getElementById('tableBody');

  if (!filtered.length) {
    body.innerHTML = `
      <tr><td colspan="20">
        <div class="empty-state">
          <div class="empty-icon">📡</div>
          <p>Tidak ada server ditemukan</p>
        </div>
      </td></tr>
    `;
    return;
  }

  body.innerHTML = filtered.map((s, i) => {
    const isExpired = s.tglAkhir && new Date(s.tglAkhir) < today;
    const dateHtml  = (s.tglMulai || s.tglAkhir)
      ? `<div class="date-range ${isExpired ? 'date-expired' : ''}">
          ${s.tglMulai || '?'} → ${s.tglAkhir || '?'}
          ${isExpired ? ' ⚠️' : ''}
        </div>`
      : '<span style="color:var(--text-3);font-size:12px;">—</span>';

    const statusBadge = s.status === 'AKTIF'
      ? '<span class="badge badge-green">Aktif</span>'
      : '<span class="badge badge-red">Nonaktif</span>';

    const adminCells = isAdmin ? `
      <td class="link-cell">
        ${s.domain ? `<a href="${esc(s.domain)}" target="_blank" rel="noopener">${shortUrl(s.domain)} ↗</a>` : '—'}
      </td>
      <td class="link-cell">
        ${s.repo ? `<a href="${esc(s.repo)}" target="_blank" rel="noopener">${shortUrl(s.repo)} ↗</a>` : '—'}
      </td>
      <td class="link-cell">
        ${s.db ? `<a href="${esc(s.db)}" target="_blank" rel="noopener">Buka DB ↗</a>` : '—'}
      </td>
      <td class="link-cell">
        ${s.linkBackend ? `<a href="${esc(s.linkBackend)}" target="_blank" rel="noopener">Buka ↗</a>` : '—'}
      </td>
      <td>${dateHtml}</td>
      <td>
        <div class="action-btns">
          <button class="toggle-btn ${s.status==='AKTIF'?'on':''}" title="Toggle Status"
            onclick="toggleStatus(${s.id})"></button>
          <button class="btn btn-outline btn-sm" onclick="openEdit(${s.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteServer(${s.id})">Hapus</button>
        </div>
      </td>
    ` : `<td>${dateHtml}</td>`;

    return `
      <tr>
        <td style="color:var(--text-3);font-family:var(--mono);font-size:12px;">${i+1}</td>
        <td>
          <div class="server-name">${esc(s.nama)}</div>
          <div class="server-type">${esc(s.jenis||'')}</div>
        </td>
        <td>${statusBadge}</td>
        ${adminCells}
      </tr>
    `;
  }).join('');
}

// ─── CRUD ───────────────────────────────────────────────────
function openModal() {
  editMode = false;
  document.getElementById('modalTitle').textContent = 'Tambah Server';
  clearForm();
  document.getElementById('modalOverlay').style.display = 'flex';
}

function openEdit(id) {
  const s = servers.find(x => x.id === id);
  if (!s) return;
  editMode = true;
  document.getElementById('modalTitle').textContent = 'Edit Server';
  document.getElementById('editId').value      = s.id;
  document.getElementById('fNama').value        = s.nama        || '';
  document.getElementById('fJenis').value       = s.jenis       || '';
  document.getElementById('fServer').value      = s.server      || '';
  document.getElementById('fDomain').value      = s.domain      || '';
  document.getElementById('fAkunGit').value     = s.akunGit     || '';
  document.getElementById('fRepo').value        = s.repo        || '';
  document.getElementById('fDb').value          = s.db          || '';
  document.getElementById('fLinkBackend').value = s.linkBackend || '';
  document.getElementById('fTglMulai').value    = s.tglMulai    || '';
  document.getElementById('fTglAkhir').value    = s.tglAkhir    || '';
  document.getElementById('fStatus').value      = s.status      || 'AKTIF';
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function clearForm() {
  ['fNama','fJenis','fServer','fDomain','fAkunGit','fRepo','fDb','fLinkBackend','fTglMulai','fTglAkhir','editId']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('fStatus').value = 'AKTIF';
}

async function saveServer() {
  const nama = document.getElementById('fNama').value.trim();
  if (!nama) { toast('Nama proyek wajib diisi', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  btn.innerHTML = '<span class="loader"></span>';
  btn.disabled  = true;

  const body = {
    nama        : nama,
    jenis       : document.getElementById('fJenis').value.trim(),
    server      : document.getElementById('fServer').value.trim(),
    domain      : document.getElementById('fDomain').value.trim(),
    akunGit     : document.getElementById('fAkunGit').value.trim(),
    repo        : document.getElementById('fRepo').value.trim(),
    db          : document.getElementById('fDb').value.trim(),
    linkBackend : document.getElementById('fLinkBackend').value.trim(),
    tglMulai    : document.getElementById('fTglMulai').value,
    tglAkhir    : document.getElementById('fTglAkhir').value,
    status      : document.getElementById('fStatus').value,
  };

  if (editMode) body.id = document.getElementById('editId').value;

  const res = await api(editMode ? 'updateServer' : 'addServer', body);

  btn.innerHTML = 'Simpan';
  btn.disabled  = false;

  if (!res.ok) { toast(res.msg || 'Gagal menyimpan', 'err'); return; }

  toast(res.msg || 'Tersimpan!', 'ok');
  closeModal();
  loadServers();
}

async function deleteServer(id) {
  if (!confirm('Yakin hapus server ini?')) return;
  const res = await api('deleteServer', { id });
  if (!res.ok) { toast(res.msg || 'Gagal hapus', 'err'); return; }
  toast(res.msg || 'Server dihapus', 'ok');
  loadServers();
}

async function toggleStatus(id) {
  const res = await api('toggleStatus', { id });
  if (!res.ok) { toast(res.msg || 'Gagal', 'err'); return; }
  const s = servers.find(x => x.id === id);
  if (s) s.status = res.status;
  updateStats();
  renderTable();
  toast('Status: ' + res.status, 'ok');
}

// ─── Utils ──────────────────────────────────────────────────
function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function shortUrl(url) {
  try {
    const u = new URL(url);
    let h = u.hostname.replace('www.','');
    if (h.length > 24) h = h.slice(0,22)+'…';
    return h;
  } catch (_) {
    return url.slice(0,24);
  }
}

let toastTimer = null;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

function showErr(el, msg) {
  el.textContent   = msg;
  el.style.display = 'block';
}
</script>
