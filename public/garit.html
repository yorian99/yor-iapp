const API_URL = "https://script.google.com/macros/s/AKfycbyTMsoed7_QElpM7kETpn2x9DybJDBcI8Y2WDyIWQWLPb3QIHhQC6NriRulWpTS4r3zbQ/exec";
// CDN fallback pribadi (pola yang sudah dipakai di proyek lain)
const CDN_FALLBACK = "https://cdn.jsdelivr.net/gh/yorian99/my-cdn@main/";

function formatRupiah(n) {
  return "Rp " + Number(n || 0).toLocaleString("id-ID");
}
function formatTanggal(d) {
  if (!d) return "-";
  return new Date(d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
}

// ============================================================
// API CLIENT
// ============================================================
async function callApi(action, payload = {}) {
  const session = JSON.parse(localStorage.getItem("pg_session") || "null");
  const body = Object.assign({ action, token: session?.token, username: session?.user?.username }, payload);
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      redirect: "follow"
    });
    if (!res.ok) {
      return { success: false, message: "Server merespons status " + res.status };
    }
    const json = await res.json();
    // Jika sesi ditolak backend, paksa logout supaya tidak stuck di layar error
    if (json && json.code === "AUTH_FAILED" && action !== "login") {
      localStorage.removeItem("pg_session");
      window.location.reload();
    }
    return json;
  } catch (err) {
    return { success: false, message: "Gagal terhubung ke server. Periksa koneksi internet Anda. (" + err.message + ")" };
  }
}

// ============================================================
// LOGIN PAGE
// ============================================================
function LoginPage({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    const res = await callApi("login", { username, password });
    setLoading(false);
    if (res.success) {
      localStorage.setItem("pg_session", JSON.stringify(res));
      onLogin(res);
    } else {
      const pesan = {
        USER_NOT_FOUND: "Username tidak ditemukan",
        WRONG_PASSWORD: "Password salah",
        NO_ACCESS: "Akun tidak aktif / tidak memiliki akses"
      }[res.message] || res.message || "Login gagal";
      Swal.fire({ icon: "error", title: "Gagal Masuk", text: pesan });
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-700 to-blue-900">
      <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
        <div className="flex justify-center mb-4">
          <img src="https://korwilkedunggalar.web.id/yori.png" alt="Logo Pemuda Garit"
            className="w-16 h-16 rounded-full object-cover shadow"
            onError={(e) => { e.target.style.display = 'none'; }} />
        </div>
        <h1 className="text-2xl font-bold text-center text-slate-800">Pemuda Garit</h1>
        <p className="text-center text-slate-500 mb-6 text-sm">Sistem Manajemen Keuangan</p>
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="text-sm text-slate-600">Username</label>
            <input value={username} onChange={e => setUsername(e.target.value)}
              className="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
          </div>
          <div>
            <label className="text-sm text-slate-600">Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
              className="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required />
          </div>
          <button disabled={loading} className="w-full bg-blue-700 text-white py-2 rounded-lg font-medium hover:bg-blue-800 disabled:opacity-50">
            {loading ? "Memproses..." : "Masuk"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ============================================================
// DASHBOARD
// ============================================================
function Dashboard() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const chartRef = React.useRef(null);
  const chartInstance = React.useRef(null);

  useEffect(() => {
    callApi("getDashboard").then(res => {
      if (res.success) setData(res.data);
      else setError(res.message || "Gagal memuat dashboard");
    });
  }, []);

  useEffect(() => {
    if (!data || !chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type: "bar",
      data: {
        labels: data.grafik.map(g => "Bln " + g.bulan),
        datasets: [
          { label: "Masuk", data: data.grafik.map(g => g.masuk), backgroundColor: "#2563eb" },
          { label: "Keluar", data: data.grafik.map(g => g.keluar), backgroundColor: "#dc2626" }
        ]
      },
      options: { responsive: true, plugins: { legend: { position: "bottom" } } }
    });
  }, [data]);

  if (error) {
    return (
      <div className="p-6 fade-in">
        <div className="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-4 text-sm">
          Gagal memuat dashboard: {error}
        </div>
      </div>
    );
  }
  if (!data) {
    return (
      <div className="p-6 space-y-6">
        <div className="skeleton h-8 w-40 rounded"></div>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
          {[1,2,3,4].map(i => <div key={i} className="skeleton h-24 rounded-xl"></div>)}
        </div>
        <div className="skeleton h-64 rounded-xl"></div>
      </div>
    );
  }

  const cards = [
    { label: "Saldo Kas", value: data.saldo, color: "bg-blue-600" },
    { label: "Total Pemasukan", value: data.totalMasuk, color: "bg-emerald-600" },
    { label: "Total Pengeluaran", value: data.totalKeluar, color: "bg-rose-600" },
    { label: "Menunggu Persetujuan", value: data.pendingApproval, color: "bg-amber-500", isCount: true }
  ];

  return (
    <div className="p-6 space-y-6">
      <h1 className="text-2xl font-bold text-slate-800">Dashboard</h1>
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
        {cards.map((c, i) => (
          <div key={i} className={`${c.color} text-white rounded-xl p-5 shadow`}>
            <p className="text-sm opacity-90">{c.label}</p>
            <p className="text-2xl font-bold mt-1">{c.isCount ? c.value : formatRupiah(c.value)}</p>
          </div>
        ))}
      </div>
      <div className="bg-white rounded-xl p-5 shadow">
        <h3 className="font-semibold mb-3 text-slate-700">Grafik Kas Tahun Ini</h3>
        <canvas ref={chartRef} height="90"></canvas>
      </div>
      <div className="bg-white rounded-xl p-5 shadow">
        <h3 className="font-semibold mb-3 text-slate-700">Aktivitas Terbaru</h3>
        <ul className="text-sm divide-y">
          {data.aktivitasTerbaru.map((log, i) => (
            <li key={i} className="py-2 flex justify-between">
              <span>{log.user} — {log.aksi} ({log.detail})</span>
              <span className="text-slate-400">{formatTanggal(log.timestamp)}</span>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

// ============================================================
// TABEL GENERIK (dipakai untuk KasMasuk / KasKeluar / dll)
// ============================================================
function DataTable({ title, columns, rows, onAdd, addLabel, extraActions, loading }) {
  return (
    <div className="p-6">
      <div className="flex justify-between items-center mb-4">
        <h1 className="text-2xl font-bold text-slate-800">{title}</h1>
        {onAdd && (
          <button onClick={onAdd} className="btn bg-blue-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 shadow-sm hover:shadow">
            + {addLabel || "Tambah"}
          </button>
        )}
      </div>
      <div className="bg-white rounded-xl shadow overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              {columns.map(c => <th key={c.key} className="text-left px-4 py-3">{c.label}</th>)}
              {extraActions && <th className="px-4 py-3">Aksi</th>}
            </tr>
          </thead>
          <tbody className="divide-y">
            {loading && Array.from({ length: 4 }).map((_, i) => (
              <tr key={"sk" + i}>
                {columns.map(c => <td key={c.key} className="px-4 py-3"><div className="skeleton h-4 rounded w-full"></div></td>)}
                {extraActions && <td className="px-4 py-3"><div className="skeleton h-4 rounded w-16"></div></td>}
              </tr>
            ))}
            {!loading && rows.map((r, i) => (
              <tr key={i} className="hover:bg-slate-50">
                {columns.map(c => (
                  <td key={c.key} className="px-4 py-3">{c.render ? c.render(r) : r[c.key]}</td>
                ))}
                {extraActions && <td className="px-4 py-3">{extraActions(r)}</td>}
              </tr>
            ))}
            {!loading && rows.length === 0 && (
              <tr><td colSpan={columns.length + 1} className="text-center text-slate-400 py-6">Belum ada data</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============================================================
// KAS MASUK
// ============================================================
function KasMasukPage({ user }) {
  const [rows, setRows] = useState([]);
  const [kategori, setKategori] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    callApi("getKasMasuk").then(r => {
      if (r.success) setRows(r.data);
      else Swal.fire("Gagal Memuat Data", r.message || "Terjadi kesalahan", "error");
      setLoading(false);
    });
  };
  useEffect(() => {
    load();
    callApi("getKategori").then(r => {
      if (r.success) setKategori(r.data.filter(k => k.tipe === "masuk"));
      else Swal.fire("Gagal Memuat Kategori", r.message || "Terjadi kesalahan", "error");
    });
  }, []);

  const handleAdd = async () => {
    if (kategori.length === 0) {
      Swal.fire("Kategori Kosong", "Belum ada kategori pemasukan. Tambahkan dulu di menu Kategori Transaksi.", "warning");
      return;
    }
    const opsi = kategori.map(k => `<option value="${k.id}">${k.nama}</option>`).join("");
    const { value: form } = await Swal.fire({
      title: "Tambah Kas Masuk",
      html: `
        <input id="tanggal" type="date" class="swal2-input" placeholder="Tanggal">
        <select id="kategori" class="swal2-input">${opsi}</select>
        <input id="jumlah" type="number" min="0" class="swal2-input" placeholder="Jumlah (Rp)">
        <input id="sumber" class="swal2-input" placeholder="Sumber (nama donatur/anggota)">
        <input id="keterangan" class="swal2-input" placeholder="Keterangan">
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: "Simpan",
      preConfirm: () => {
        const tanggal = document.getElementById("tanggal").value;
        const jumlah = document.getElementById("jumlah").value;
        if (!tanggal) { Swal.showValidationMessage("Tanggal wajib diisi"); return false; }
        if (!jumlah || Number(jumlah) <= 0) { Swal.showValidationMessage("Jumlah harus lebih dari 0"); return false; }
        return {
          tanggal,
          kategori_id: document.getElementById("kategori").value,
          jumlah,
          sumber: document.getElementById("sumber").value,
          keterangan: document.getElementById("keterangan").value
        };
      }
    });
    if (!form) return;
    Swal.fire({ title: "Menyimpan...", didOpen: () => Swal.showLoading(), allowOutsideClick: false });
    const res = await callApi("addKasMasuk", form);
    if (res.success) { Swal.fire({ icon: "success", title: "Berhasil", text: "Data kas masuk ditambahkan", timer: 1500, showConfirmButton: false }); load(); }
    else Swal.fire("Gagal", res.message || "Terjadi kesalahan pada server", "error");
  };

  const columns = [
    { key: "tanggal", label: "Tanggal", render: r => formatTanggal(r.tanggal) },
    { key: "kategori_id", label: "Kategori", render: r => kategori.find(k => k.id === r.kategori_id)?.nama || r.kategori_id },
    { key: "sumber", label: "Sumber" },
    { key: "jumlah", label: "Jumlah", render: r => formatRupiah(r.jumlah) },
    { key: "dicatat_oleh", label: "Dicatat Oleh" }
  ];

  return <DataTable title="Kas Masuk" columns={columns} rows={rows} onAdd={handleAdd} addLabel="Pemasukan" loading={loading} />;
}

        <select id="kategori" class="swal2-input">${opsi}</select>
        <input id="jumlah" type="number" min="0" class="swal2-input" placeholder="Jumlah (Rp)">

        if (!tanggal) { Swal.showValidationMessage("Tanggal wajib diisi"); return false; }
        if (!jumlah || Number(jumlah) <= 0) { Swal.showValidationMessage("Jumlah harus lebih dari 0"); return false; }
        return {
          tanggal,
          kategori_id: document.getElementById("kategori").value,
          jumlah,

      }

    { key: "jumlah", label: "Jumlah", render: r => formatRupiah(r.jumlah) },
    { key: "status_approval", label: "Status", render: r => badge(r.status_approval) },
    { key: "dicatat_oleh", label: "Dicatat Oleh" }
  ];

  return <DataTable title="Kas Keluar" columns={columns} rows={rows} onAdd={handleAdd} addLabel="Pengeluaran" loading={loading} />;
}

// ============================================================
// PERSETUJUAN PENGELUARAN
// ============================================================
function ApprovalPage() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const load = () => {
    setLoading(true);
    callApi("getKasKeluar").then(r => {
      if (r.success) setRows(r.data.filter(k => k.status_approval === "pending"));
      else Swal.fire("Gagal Memuat", r.message || "Terjadi kesalahan", "error");
      setLoading(false);
    });
  };
  useEffect(load, []);

  const handleApprove = async (id, disetujui) => {
    const konfirmasi = await Swal.fire({
      title: disetujui ? "Setujui pengeluaran ini?" : "Tolak pengeluaran ini?",
      icon: "question",
      showCancelButton: true,
      confirmButtonText: "Ya",
      cancelButtonText: "Batal"
    });
    if (!konfirmasi.isConfirmed) return;
    const res = await callApi("approveKasKeluar", { id, disetujui });
    if (res.success) { Swal.fire({ icon: "success", title: disetujui ? "Disetujui" : "Ditolak", timer: 1200, showConfirmButton: false }); load(); }
    else Swal.fire("Gagal", res.message || "Terjadi kesalahan", "error");
  };

  const columns = [
    { key: "tanggal", label: "Tanggal", render: r => formatTanggal(r.tanggal) },
    { key: "jumlah", label: "Jumlah", render: r => formatRupiah(r.jumlah) },
    { key: "keterangan", label: "Keterangan" },
    { key: "dicatat_oleh", label: "Diajukan Oleh" }
  ];

  return (
    <DataTable
      title="Persetujuan Pengeluaran"
      columns={columns}
      rows={rows}
      loading={loading}
      extraActions={(r) => (
        <div className="flex gap-2">
          <button onClick={() => handleApprove(r.id, true)} className="btn text-emerald-600 hover:underline text-xs">Setujui</button>
          <button onClick={() => handleApprove(r.id, false)} className="btn text-rose-600 hover:underline text-xs">Tolak</button>
        </div>
      )}
    />
  );
}

// ============================================================
// LAPORAN KEUANGAN (dengan export PDF/Excel)
// ============================================================
function LaporanPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [exporting, setExporting] = useState(false);

  const load = () => {
    setLoading(true);
    callApi("getLaporan", {}).then(r => {
      if (r.success) setData(r.data);
      else Swal.fire("Gagal Memuat Laporan", r.message || "Terjadi kesalahan", "error");
      setLoading(false);
    });
  };
  useEffect(load, []);

  const exportPDF = () => {
    if (!data || (data.kasMasuk.length === 0 && data.kasKeluar.length === 0)) {
      Swal.fire("Tidak Ada Data", "Belum ada transaksi untuk diekspor.", "info");
      return;
    }
    setExporting(true);
    try {
      const doc = new window.jspdf.jsPDF();
      doc.setFontSize(14);
      doc.text("Laporan Keuangan - Pemuda Garit", 14, 15);
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text("Dicetak: " + new Date().toLocaleDateString("id-ID"), 14, 21);

      const body = [
        ...data.kasMasuk.map(r => [formatTanggal(r.tanggal), "Masuk", r.keterangan || "-", formatRupiah(r.jumlah)]),
        ...data.kasKeluar.map(r => [formatTanggal(r.tanggal), "Keluar", r.keterangan || "-", formatRupiah(r.jumlah)])
      ].sort((a, b) => new Date(a[0]) - new Date(b[0]));

      doc.autoTable({
        startY: 26,
        head: [["Tanggal", "Tipe", "Keterangan", "Jumlah"]],
        body,
        headStyles: { fillColor: [29, 78, 216] },
        styles: { fontSize: 9 }
      });

      const finalY = doc.lastAutoTable.finalY || 26;
      doc.setFontSize(11);
      doc.setTextColor(0);
      doc.text("Total Masuk: " + formatRupiah(data.totalMasuk), 14, finalY + 10);
      doc.text("Total Keluar: " + formatRupiah(data.totalKeluar), 14, finalY + 17);
      doc.text("Saldo Akhir: " + formatRupiah(data.saldo), 14, finalY + 24);

      doc.save("laporan-keuangan-" + new Date().toISOString().slice(0, 10) + ".pdf");
    } catch (err) {
      Swal.fire("Gagal Export PDF", err.message, "error");
    } finally {
      setExporting(false);
    }
  };

  const exportExcel = () => {
    if (!data || (data.kasMasuk.length === 0 && data.kasKeluar.length === 0)) {
      Swal.fire("Tidak Ada Data", "Belum ada transaksi untuk diekspor.", "info");
      return;
    }
    try {
      const wsData = [
        ["Tanggal", "Tipe", "Keterangan", "Jumlah"],
        ...data.kasMasuk.map(r => [formatTanggal(r.tanggal), "Masuk", r.keterangan || "-", r.jumlah]),
        ...data.kasKeluar.map(r => [formatTanggal(r.tanggal), "Keluar", r.keterangan || "-", r.jumlah])
      ];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Laporan");
      XLSX.writeFile(wb, "laporan-keuangan-" + new Date().toISOString().slice(0, 10) + ".xlsx");
    } catch (err) {
      Swal.fire("Gagal Export Excel", err.message, "error");
    }
  };

  if (loading) {
    return (
      <div className="p-6 space-y-4">
        <div className="skeleton h-8 w-64 rounded"></div>
        <div className="grid grid-cols-3 gap-4">
          {[1,2,3].map(i => <div key={i} className="skeleton h-20 rounded-xl"></div>)}
        </div>
      </div>
    );
  }
  if (!data) return <div className="p-8 text-slate-400">Data tidak tersedia.</div>;

  return (
    <div className="p-6 space-y-4">
      <div className="flex justify-between items-center flex-wrap gap-3">
        <h1 className="text-2xl font-bold text-slate-800">Laporan Keuangan</h1>
        <div className="flex gap-2">
          <button onClick={exportPDF} disabled={exporting} className="btn bg-rose-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-rose-700 disabled:opacity-50 shadow-sm">
            {exporting ? "Membuat PDF..." : "Export PDF"}
          </button>
          <button onClick={exportExcel} className="btn bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700 shadow-sm">Export Excel</button>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div className="bg-white p-4 rounded-xl shadow"><p className="text-sm text-slate-500">Total Masuk</p><p className="text-xl font-bold text-emerald-600">{formatRupiah(data.totalMasuk)}</p></div>
        <div className="bg-white p-4 rounded-xl shadow"><p className="text-sm text-slate-500">Total Keluar</p><p className="text-xl font-bold text-rose-600">{formatRupiah(data.totalKeluar)}</p></div>
        <div className="bg-white p-4 rounded-xl shadow"><p className="text-sm text-slate-500">Saldo</p><p className="text-xl font-bold text-blue-700">{formatRupiah(data.saldo)}</p></div>
      </div>
    </div>
  );
}

// ============================================================
// HALAMAN SEDERHANA LAIN (Anggota, Kategori, Anggaran, Pengguna)
// Kerangka dasar — sudah terhubung API, siap dikembangkan lebih detail
// ============================================================
function SimpleListPage({ title, getAction, addAction, fields }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = () => {
    setLoading(true);
    callApi(getAction).then(r => {
      if (r.success) setRows(r.data);
      else if (r.message) Swal.fire("Gagal Memuat", r.message, "error");
      setLoading(false);
    });
  };
  useEffect(load, []);

  const handleAdd = async () => {
    const inputs = fields.map(f => {
      if (f.type === "select") {
        const opts = f.options.map(o => `<option value="${o.v}">${o.l}</option>`).join("");
        return `<select id="${f.key}" class="swal2-input">${opts}</select>`;
      }
      return `<input id="${f.key}" class="swal2-input" placeholder="${f.label}">`;
    }).join("");
    const { value: form } = await Swal.fire({
      title: "Tambah " + title,
      html: inputs,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: "Simpan",
      preConfirm: () => {
        const obj = {};
        fields.forEach(f => (obj[f.key] = document.getElementById(f.key).value));
        return obj;
      }
    });
    if (!form) return;
    const res = await callApi(addAction, form);
    if (res.success) { Swal.fire({ icon: "success", title: "Berhasil", text: "Data ditambahkan", timer: 1500, showConfirmButton: false }); load(); }
    else Swal.fire("Gagal", res.message || "Terjadi kesalahan", "error");
  };

  const columns = fields.map(f => ({ key: f.key, label: f.label }));
  return <DataTable title={title} columns={columns} rows={rows} onAdd={handleAdd} loading={loading} />;
}

// ============================================================
// APP UTAMA
// ============================================================
function App() {
  const [session, setSession] = useState(() => JSON.parse(localStorage.getItem("pg_session") || "null"));
  const [active, setActive] = useState("dashboard");
  const [checking, setChecking] = useState(true);

  // Validasi sesi ke server saat pertama kali dimuat / reload,
  // supaya token yang sudah tidak valid (user dinonaktifkan dll) tidak nyangkut.
  useEffect(() => {
    if (!session) { setChecking(false); return; }
    callApi("getDashboard").then(res => {
      if (res.success === false && res.code === "AUTH_FAILED") {
        localStorage.removeItem("pg_session");
        setSession(null);
      }
      setChecking(false);
    });
  }, []);

  if (checking) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50">
        <div className="flex flex-col items-center gap-3 fade-in">
          <img src="https://korwilkedunggalar.web.id/yori.png" className="w-12 h-12 rounded-full" onError={(e) => { e.target.style.display = 'none'; }} />
          <p className="text-slate-400 text-sm">Memuat sesi...</p>
        </div>
      </div>
    );
  }

  if (!session) return <LoginPage onLogin={setSession} />;

  const handleLogout = () => {
    localStorage.removeItem("pg_session");
    setSession(null);
  };

  const pages = {
    dashboard: <Dashboard />,
    kasmasuk: <KasMasukPage user={session.user} />,
    kaskeluar: <KasKeluarPage user={session.user} />,
    approval: <ApprovalPage />,
    laporan: <LaporanPage />,
    kategori: <SimpleListPage title="Kategori" getAction="getKategori" addAction="addKategori"
      fields={[{ key: "nama", label: "Nama Kategori" }, { key: "tipe", label: "Tipe", type: "select", options: [{v:"masuk",l:"Masuk"},{v:"keluar",l:"Keluar"}] }]} />,
    anggota: <SimpleListPage title="Data Anggota" getAction="getAnggota" addAction="addAnggota"
      fields={[{ key: "nama", label: "Nama" }, { key: "alamat", label: "Alamat" }, { key: "no_hp", label: "No. HP" }]} />,
    anggaran: <SimpleListPage title="Anggaran Kegiatan" getAction="getAnggaran" addAction="addAnggaran"
      fields={[{ key: "kegiatan_id", label: "ID Kegiatan" }, { key: "kategori_id", label: "ID Kategori" }, { key: "jumlah_anggaran", label: "Jumlah Anggaran" }, { key: "tahun", label: "Tahun" }]} />,
    pengguna: <SimpleListPage title="Pengguna" getAction="getUsers" addAction="addUser"
      fields={[{ key: "username", label: "Username" }, { key: "password", label: "Password" }, { key: "nama", label: "Nama" }, { key: "jabatan", label: "Jabatan", type: "select", options: [{v:"Admin",l:"Admin"},{v:"Bendahara",l:"Bendahara"},{v:"Ketua",l:"Ketua"},{v:"Anggota",l:"Anggota"}] }]} />
  };

  return (
    <div className="flex">
      <Sidebar active={active} setActive={setActive} user={session.user} onLogout={handleLogout} />
      <div key={active} className="flex-1 fade-in">{pages[active]}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
