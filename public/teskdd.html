<body class="bg-slate-100 text-slate-800 font-sans antialiased">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ── DATA ────────────────────────────────────────────────────────
const lembagaList = [
  "SDN BANGUNREJO KIDUL 1",
  "SDN BANGUNREJO KIDUL 2",
  "SDN BANGUNREJO KIDUL 3",
  "SDN BANGUNREJO KIDUL 4",
  "SDN BANGUNREJO KIDUL 5",
  "SDN BANGUNREJO KIDUL 7",
  "SDN BANGUNREJO KIDUL 8",
  "SDN BANGUNREJO KIDUL 9",
  "SDN BEGAL 1",
  "SDN GEMARANG 1",
  "SDN GEMARANG 3",
  "SDN GEMARANG 4",
  "SDN GEMARANG 5",
  "SDN GEMARANG 6",
  "SDN GEMARANG 7",
  "SDN JATIGEMBOL 1",
  "SDN JATIGEMBOL 2",
  "SDN JATIGEMBOL 5",
  "SDN JENGGRIK 1",
  "SDN JENGGRIK 2",
  "SDN JENGGRIK 3",
  "SDN JENGGRIK 4",
  "SDN JENGGRIK 6",
  "SDN KATIKAN 1",
  "SDN KATIKAN 2",
  "SDN KATIKAN 3",

  "SDN KAWU 4",
  "SDN KEDUNGGALAR 1",
  "SDN KEDUNGGALAR 3",
  "SDN KEDUNGGALAR 4",
  "SDN KEDUNGGALAR 5",
  "SDN KEDUNGGALAR 8",
  "SDN PELANG KIDUL 1",

  "SDN PELANG LOR 1",
  "SDN PELANG LOR 2",

  "SDN WONOKERTO 4",
  "SDN WONOREJO 1"
];

// ── UTILS ───────────────────────────────────────────────────────
// MASUKKAN URL WEB APP GOOGLE APPS SCRIPT DI SINI!
const GAS_URL = "https://script.google.com/macros/s/AKfycbwFfqRG9TkA3-HqYO_30c9V3VEBL15fM-u29-yuJSS8LOgy0CTIM8lfg0n_UeVHFIU4/exec"; 

const runGoogleScript = async (fn, ...args) => {
  try {
    // PERBAIKAN: Hapus properti 'headers' agar browser menganggap ini "Simple Request"
    // dan menghindari error CORS / Preflight OPTIONS.
    const response = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: fn, args: args })
    });
    const data = await response.json();
    return data;
  } catch (error) {
    console.error('Error memanggil API Apps Script:', error);
    throw error;
  }
};

const extractFileId = (url) => {
  if (!url) return null;
  let m = url.match(/\/file\/d\/([^\/]+)/); if (m) return m[1];
  m = url.match(/[?&]id=([^&]+)/);         if (m) return m[1];
  m = url.match(/\/d\/([^\/]+)\/preview/); return m ? m[1] : null;
};

const checkLateStatus = (w, jenis) => {
  if (!w || !jenis || jenis.toLowerCase() !== 'datang') return false;
  try {
    const parts = w.split('pukul '); if (parts.length < 2) return false;
    const [hh, mm] = parts[1].trim().split(/[\.\:]/);
    return (parseInt(hh,10)*60 + parseInt(mm,10)) > 420;
  } catch { return false; }
};
const isOutsideRadius = k => k && k.toLowerCase().includes('luar radius');
const isTidakHadir   = k => k && (k.toLowerCase().includes('tidak hadir') || k.toLowerCase().includes('hari libur'));
const normalizeName  = n => n ? n.replace(/[^a-zA-Z0-9]/g,'').toLowerCase() : '';

const parsePresensiDate = w => {
  if (!w) return null;
  const dateParts = w.split('pukul')[0].trim().split(', ')[1];
  if (!dateParts) return null;
  const [day, mon, yr] = dateParts.split(' ');
  const MAP = {Januari:1,Februari:2,Maret:3,April:4,Mei:5,Juni:6,
               Juli:7,Agustus:8,September:9,Oktober:10,November:11,Desember:12};
  const m = MAP[mon]; if (!m) return null;
  return `${day.padStart(2,'0')}/${String(m).padStart(2,'0')}/${yr}`;
};
const dateToNumber = d => {
  if (!d) return null;
  const [dd,mm,yy] = d.split('/').map(Number);
  return (!dd||!mm||!yy) ? null : yy*10000+mm*100+dd;
};
const isDateInRangeNum = (d,s,e) => { const n=dateToNumber(d); return n!==null&&n>=s&&n<=e; };
const parseIjinDate = d => {
  if (!d) return null;
  const [y,m,dd] = d.split('-'); if (!y||!m||!dd) return null;
  return `${dd.padStart(2,'0')}/${m.padStart(2,'0')}/${y}`;
};
const isDateInRange = (d,s,e) => {
  if (!d||!s||!e) return false;
  const n = x => { const [a,b,c]=x.split('/').map(Number); return c*10000+b*100+a; };
  return n(d)>=n(s) && n(d)<=n(e);
};
const enrichPresensiWithIjin = (prs, ijin) => {
  if (!prs||!ijin) return prs;
  const approved = ijin.filter(i=>i.Status&&i.Status.toLowerCase()==='disetujui');
  return prs.map(p => {
    const psw = approved.some(ij => {
      if (normalizeName(p['Nama Pegawai']||'')!==normalizeName(ij['Nama Pegawai']||'')) return false;
      const pd = parsePresensiDate(p['Waktu']); if (!pd) return false;
      const s=parseIjinDate(ij['Tanggal Awal']), e=parseIjinDate(ij['Tanggal Berakir']);
      if (!s||!e) return false;
      return isDateInRange(pd,s,e);
    });
    return psw ? {...p,isPSW:true,displayRadius:'PSW'} : {...p,isPSW:false,displayRadius:p['Keterangan Radius']};
  });
};

const fmtTs = ts => {
  if (!ts) return '-';
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch { return String(ts); }
};

// ── PAGINATION ──────────────────────────────────────────────────
const TablePagination = ({ currentPage, totalItems, rowsPerPage, onPageChange, onRowsPerPageChange }) => {
  const total = Math.ceil(totalItems/rowsPerPage)||1;
  const [jump, setJump] = useState('');
  const doJump = () => {
    let p = parseInt(jump,10); if(isNaN(p)) p=1;
    p = Math.min(Math.max(1,p),total);
    onPageChange(p); setJump('');
  };
  const btnCls = (dis) => `w-8 h-8 rounded-lg border flex items-center justify-center text-xs transition-all ${dis?'border-slate-100 bg-slate-50 text-slate-300 cursor-not-allowed':'border-slate-200 bg-white text-slate-500 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-600'}`;
  return (
    <div className="flex flex-col sm:flex-row items-center justify-between px-5 py-3 bg-slate-50 border-t border-slate-100 gap-3">
      <div className="flex items-center gap-2 text-xs text-slate-500">
        Tampilkan
        <select className="border border-slate-200 rounded-lg px-2 py-1 bg-white text-xs outline-none focus:ring-2 focus:ring-blue-400" value={rowsPerPage}
          onChange={e=>{const v=e.target.value==='all'?totalItems:Number(e.target.value);onRowsPerPageChange(v);onPageChange(1);}}>
          {[10,25,50,100].map(n=><option key={n} value={n}>{n}</option>)}
          <option value="all">Semua</option>
        </select>
        baris — <strong className="text-slate-700">{totalItems}</strong> data
      </div>
      <div className="flex items-center gap-1">
        <button onClick={()=>onPageChange(1)} disabled={currentPage===1} className={btnCls(currentPage===1)}><i className="fas fa-angle-double-left"></i></button>
        <button onClick={()=>onPageChange(currentPage-1)} disabled={currentPage===1} className={btnCls(currentPage===1)}><i className="fas fa-angle-left"></i></button>
        <span className="px-3 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold min-w-[72px] text-center">{currentPage} / {total}</span>
        <button onClick={()=>onPageChange(currentPage+1)} disabled={currentPage>=total} className={btnCls(currentPage>=total)}><i className="fas fa-angle-right"></i></button>
        <button onClick={()=>onPageChange(total)} disabled={currentPage>=total} className={btnCls(currentPage>=total)}><i className="fas fa-angle-double-right"></i></button>
      </div>
      <div className="flex items-center gap-2">
        <input type="number" min="1" max={total} value={jump} onChange={e=>setJump(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&doJump()}
          className="w-16 border border-slate-200 rounded-lg px-2 py-1 text-xs text-center bg-white outline-none focus:ring-2 focus:ring-blue-400" placeholder="Hal" />
        <button onClick={doJump} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-colors">Go</button>
      </div>
    </div>
  );
};

// ── LOGIN ───────────────────────────────────────────────────────
const Login = ({ onLogin }) => {
  const [un,setUn]=useState(''), [pw,setPw]=useState(''), [load,setLoad]=useState(false), [show,setShow]=useState(false);
  const submit = async e => {
    e.preventDefault(); setLoad(true);
    try {
      const r = await runGoogleScript('login',un,pw);
      if (r&&r.success) onLogin(r.user);
      else Swal.fire({icon:'error',title:'Akses Ditolak',text:r.message || 'Username atau password salah!',confirmButtonColor:'#2563eb'});
    } catch(err) {
      Swal.fire({icon:'error',title:'Koneksi Gagal',text:'Tidak dapat menghubungi server API.',confirmButtonColor:'#2563eb'});
    }
    setLoad(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 px-4">
      <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden flex flex-col md:flex-row">
        <div className="md:w-5/12 p-8 lg:p-12 flex flex-col justify-center anim-l">
          <div className="mb-8">
            <div className="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mb-5 shadow-lg shadow-blue-400/30">
              <i className="fas fa-fingerprint text-2xl text-white"></i>
            </div>
            <h2 className="text-3xl font-black text-slate-800 tracking-tight">Korwil Kedunggalar</h2>
            <p className="text-slate-400 text-sm mt-1">Sistem Monitoring Presensi Digital</p>
          </div>
          <form onSubmit={submit} className="space-y-4">
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-400 tracking-widest mb-1.5">Username</label>
              <div className="relative">
                <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300"><i className="fas fa-user text-sm"></i></span>
                <input type="text" required className="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl text-sm focus:border-blue-500 outline-none transition-colors placeholder-slate-300" placeholder="Masukkan username" value={un} onChange={e=>setUn(e.target.value)} />
              </div>
            </div>
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-400 tracking-widest mb-1.5">Password</label>
              <div className="relative">
                <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-300"><i className="fas fa-lock text-sm"></i></span>
                <input type={show?"text":"password"} required className="w-full pl-10 pr-11 py-3 border-2 border-slate-200 rounded-xl text-sm focus:border-blue-500 outline-none transition-colors placeholder-slate-300" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} />
                <button type="button" onClick={()=>setShow(!show)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-300 hover:text-blue-500 transition-colors"><i className={`fas ${show?'fa-eye-slash':'fa-eye'} text-sm`}></i></button>
              </div>
            </div>
            <button type="submit" disabled={load} className="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-3.5 rounded-xl font-black text-sm tracking-wider shadow-lg shadow-blue-500/25 transition-all disabled:opacity-60">
              {load ? <span><i className="fas fa-spinner fa-spin mr-2"></i>Memproses...</span> : <span><i className="fas fa-sign-in-alt mr-2"></i>MASUK</span>}
            </button>
          </form>
          <p className="text-center text-[10px] text-slate-300 mt-8">Dinas Pendidikan Kabupaten Ngawi © {new Date().getFullYear()}</p>
        </div>
        <div className="hidden md:flex md:w-7/12 bg-gradient-to-br from-blue-700 via-blue-800 to-indigo-900 p-12 flex-col justify-center items-center text-white anim-r relative overflow-hidden">
          <div className="absolute inset-0 opacity-20">
            <div className="absolute top-0 right-0 w-72 h-72 rounded-full bg-white blur-3xl"></div>
            <div className="absolute bottom-0 left-0 w-64 h-64 rounded-full bg-indigo-400 blur-3xl"></div>
          </div>
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/1280px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png" alt="Logo Ngawi" className="w-36 h-36 object-contain mb-7 drop-shadow-2xl relative" onError={e=>{e.target.onerror=null;e.target.src='https://via.placeholder.com/200?text=Logo'}} />
          <h3 className="text-3xl font-black text-center leading-tight relative">Monitoring Presensi<br/><span className="text-blue-300">Korwil Kedunggalar</span></h3>
          <p className="text-sm text-blue-200 text-center mt-3 relative">Dinas Pendidikan Kabupaten Ngawi</p>
          <div className="mt-6 flex gap-2 text-xs bg-white/15 py-2.5 px-5 rounded-full border border-white/20 relative">
            <i className="fas fa-calendar-check text-blue-200"></i>
            <span>{new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
          </div>
          <div className="mt-5 grid grid-cols-2 gap-3 w-full max-w-xs relative">
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><div className="text-2xl font-black">{lembagaList.length}</div><div className="text-[9px] text-blue-300 uppercase tracking-wider mt-0.5">Lembaga SD</div></div>
            <div className="bg-white/10 rounded-xl p-3 text-center border border-white/10"><div className="text-2xl font-black">24/7</div><div className="text-[9px] text-blue-300 uppercase tracking-wider mt-0.5">Monitoring</div></div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── DASHBOARD ───────────────────────────────────────────────────
const Dashboard = ({ presensiData, ijinData, pegawaiData }) => {
  const chartRef = useRef(null), chartInst = useRef(null);
  const tot  = lembagaList.length;
  const totP = pegawaiData ? pegawaiData.length : 0;
  const jD   = presensiData.filter(p=>(p['Jenis Presensi']||'').toLowerCase()==='datang').length;
  const jP   = presensiData.filter(p=>(p['Jenis Presensi']||'').toLowerCase()==='pulang').length;
  const appIjin = (ijinData||[]).filter(i=>i.Status&&i.Status.toLowerCase()==='disetujui');
  const jDL  = appIjin.filter(i=>(i['Jenis Ijin']||'')==='Dinas Luar').length;
  const jI   = appIjin.filter(i=>(i['Jenis Ijin']||'')==='Ijin').length;
  const jS   = appIjin.filter(i=>(i['Jenis Ijin']||'')==='Sakit').length;
  const pDiaj = ijinData?ijinData.length:0;
  const pSet  = appIjin.length;
  const pTol  = ijinData?ijinData.filter(i=>i.Status&&i.Status.toLowerCase()==='ditolak').length:0;
  useEffect(()=>{
    if(!chartRef.current) return;
    if(chartInst.current) chartInst.current.destroy();
    chartInst.current = new Chart(chartRef.current,{
      type:'bar',
      data:{labels:['Datang','Pulang','Dinas Luar','Ijin','Sakit'],datasets:[{
        label:'Jumlah', data:[jD,jP,jDL,jI,jS],
        backgroundColor:['#3b82f6','#f59e0b','#10b981','#8b5cf6','#ec4899'],
        borderRadius:8, borderWidth:0
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw} orang`}}},
               scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}
    });
    return ()=>{ if(chartInst.current) chartInst.current.destroy(); };
  },[jD,jP,jDL,jI,jS]);

  const Card = ({ic,label,val,bg,tc,bcl}) => (
    <div className={`stat-card bg-white p-5 rounded-2xl border border-slate-100 shadow-sm relative overflow-hidden`}>
      <div className={`absolute right-0 top-0 w-20 h-20 ${bg} rounded-bl-3xl opacity-50`}></div>
      <div className={`w-10 h-10 ${bg} rounded-xl flex items-center justify-center mb-3`}><i className={`fas ${ic} ${tc} text-lg`}></i></div>
      <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{label}</p>
      <p className={`text-3xl font-black ${tc} mt-1`}>{val}</p>
    </div>
  );
  return (
    <div className="space-y-6 anim-f">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Card ic="fa-school"       label="Total Lembaga"  val={tot}  bg="bg-blue-50"    tc="text-blue-600" />
        <Card ic="fa-users"        label="Total Pegawai"  val={totP} bg="bg-emerald-50" tc="text-emerald-600" />
        <Card ic="fa-sign-in-alt"  label="Absen Datang"  val={jD}   bg="bg-amber-50"   tc="text-amber-600" />
        <Card ic="fa-sign-out-alt" label="Absen Pulang"  val={jP}   bg="bg-orange-50"  tc="text-orange-600" />
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
          <h3 className="font-bold text-sm text-slate-700 mb-5 flex items-center gap-2"><span className="w-7 h-7 bg-blue-50 rounded-lg flex items-center justify-center"><i className="fas fa-chart-bar text-blue-500 text-xs"></i></span> Grafik Kehadiran & Ijin</h3>
          <div className="h-60"><canvas ref={chartRef}></canvas></div>
        </div>
        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
          <h3 className="font-bold text-sm text-slate-700 mb-5 flex items-center gap-2"><span className="w-7 h-7 bg-purple-50 rounded-lg flex items-center justify-center"><i className="fas fa-file-signature text-purple-500 text-xs"></i></span> Statistik PSW</h3>
          <div className="grid grid-cols-3 gap-3 mb-4">
            {[['Diajukan',pDiaj,'bg-blue-50 border-blue-100','text-blue-700'],['Disetujui',pSet,'bg-green-50 border-green-100','text-green-700'],['Ditolak',pTol,'bg-red-50 border-red-100','text-red-700']].map(([l,v,bg,tc])=>(
              <div key={l} className={`text-center p-3 ${bg} rounded-xl border`}><p className={`text-[9px] ${tc} font-bold uppercase tracking-wider`}>{l}</p><p className={`text-2xl font-black ${tc} mt-1`}>{v}</p></div>
            ))}
          </div>
          <div className="space-y-2.5 pt-3 border-t border-slate-100">
            {[['Dinas Luar',jDL,'text-indigo-600','bg-indigo-50'],['Ijin',jI,'text-purple-600','bg-purple-50'],['Sakit',jS,'text-rose-600','bg-rose-50']].map(([l,v,tc,bg])=>(
              <div key={l} className="flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600 flex items-center gap-2"><span className={`w-2 h-2 rounded-full ${bg.replace('bg','bg')}`}></span>{l}</span>
                <span className={`text-base font-black ${tc} ${bg} px-3 py-0.5 rounded-lg`}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2"><i className="fas fa-palette text-slate-300"></i> Keterangan Warna Baris</p>
        <div className="flex flex-wrap gap-2">
          {[['bg-green-100 border-green-200 text-green-700','PSW (Disetujui)'],['bg-yellow-100 border-yellow-200 text-yellow-700','Terlambat (>07:00)'],['bg-red-100 border-red-200 text-red-700','Luar Radius'],['bg-slate-800 border-slate-700 text-white','Tidak Hadir'],['bg-white border-slate-200 text-slate-600','Normal']].map(([c,l])=>(
            <span key={l} className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[10px] font-bold border ${c}`}><span className={`w-2 h-2 rounded-full ${c.split(' ')[0]}`}></span>{l}</span>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── MONITORING PRESENSI ─────────────────────────────────────────
const MonitoringPresensi = ({ data, refreshData, userRole, userLembaga }) => {
  const [flLem,setFlLem]=useState(''), [flNama,setFlNama]=useState('');
  const [editingRow,setEditingRow]=useState(null), [editVal,setEditVal]=useState('');
  const [modalImg,setModalImg]=useState(null), [modalMap,setModalMap]=useState(null);
  const [page,setPage]=useState(1), [rpp,setRpp]=useState(10);
  const [showRange,setShowRange]=useState(false);
  const [rStart,setRStart]=useState(''), [rEnd,setREnd]=useState(''), [rStat,setRStat]=useState('Libur'), [rKet,setRKet]=useState('');
  const [showCRUD,setShowCRUD]=useState(false), [cMode,setCMode]=useState('add'), [cRowIdx,setCRowIdx]=useState(null);
  const [fv,setFv]=useState({'Hari Tanggal':'','Waktu':'','Jenis Presensi':'','Nama Lembaga':'','Nama Pegawai':'','Nip':'','Bukti Dukung':'','Latitude':'','Longitude':'','Jarak Absen':'','Keterangan Radius':'','Keterangan Bukti':''});

  const canEdit = userRole==='Admin'||userRole==='User'||userRole==='Superuser';
  const canLibur= userRole==='Admin'||userRole==='Superuser';
  const canBukti= userRole==='Admin'||userRole==='User'||userRole==='Superuser';
  const isAdmin = userRole==='Admin';

  const normCoord = c => (c===null||c===undefined||c==='') ? '' : c.toString().replace(/,/g,'.').trim();

  useEffect(()=>{ if(!canEdit&&userLembaga) setFlLem(userLembaga); },[canEdit,userLembaga]);
  const filtered = useMemo(()=>data.filter(i=>(i['Nama Lembaga']||'').toLowerCase().includes(flLem.toLowerCase())&&(i['Nama Pegawai']||'').toLowerCase().includes(flNama.toLowerCase())),[data,flLem,flNama]);
  useEffect(()=>setPage(1),[flLem,flNama]);
  const total = filtered.length;
  useEffect(()=>{ if(rpp>total&&total>0) setRpp(total); else if(total===0) setRpp(10); },[total,rpp]);
  const eff = rpp===total?total:rpp;
  const paged = filtered.slice((page-1)*eff, page*eff);

  const saveKet = async idx => {
    const r = await runGoogleScript('updateKeteranganBukti',idx,editVal);
    if(r.success){ Swal.fire({icon:'success',title:'Tersimpan',timer:700,showConfirmButton:false,toast:true,position:'top-end'}); setEditingRow(null); refreshData(); }
  };
  const openAdd = () => { setCMode('add'); setCRowIdx(null); setFv({'Hari Tanggal':'','Waktu':'','Jenis Presensi':'','Nama Lembaga':'','Nama Pegawai':'','Nip':'','Bukti Dukung':'','Latitude':'','Longitude':'','Jarak Absen':'','Keterangan Radius':'','Keterangan Bukti':''}); setShowCRUD(true); };
  const openEdit= item => { setCMode('edit'); setCRowIdx(item._rowIndex); setFv({'Hari Tanggal':item['Hari Tanggal']||'','Waktu':item['Waktu']||'','Jenis Presensi':item['Jenis Presensi']||'','Nama Lembaga':item['Nama Lembaga']||'','Nama Pegawai':item['Nama Pegawai']||'','Nip':item['Nip']||'','Bukti Dukung':item['Bukti Dukung']||'','Latitude':item['Latitude']||'','Longitude':item['Longitude']||'','Jarak Absen':item['Jarak Absen']||'','Keterangan Radius':item['Keterangan Radius']||'','Keterangan Bukti':item['Keterangan Bukti']||''}); setShowCRUD(true); };
  const delItem = async (idx,nm) => {
    const c = await Swal.fire({title:'Hapus Presensi?',text:`Yakin hapus presensi ${nm}?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#334155',confirmButtonText:'Ya, Hapus'});
    if(c.isConfirmed){ const la=Swal.fire({title:'Menghapus...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()}); const r=await runGoogleScript('deletePresensi',idx); la.close(); if(r.success){Swal.fire({icon:'success',title:'Terhapus',timer:1200,showConfirmButton:false});refreshData();}else Swal.fire('Error','Gagal menghapus','error'); }
  };
  const submitCRUD = async () => {
    if(!fv['Waktu']||!fv['Jenis Presensi']||!fv['Nama Pegawai']){ Swal.fire('Peringatan','Waktu, Jenis Presensi, dan Nama Pegawai wajib diisi.','warning'); return; }
    const la=Swal.fire({title:'Menyimpan...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const r = cMode==='add' ? await runGoogleScript('addPresensi',fv) : await runGoogleScript('updatePresensi',cRowIdx,fv);
    la.close();
    if(r.success){ Swal.fire({icon:'success',title:cMode==='add'?'Ditambahkan':'Diperbarui',timer:1200,showConfirmButton:false}); setShowCRUD(false); refreshData(); }
    else Swal.fire('Error','Gagal menyimpan data','error');
  };

  const iCls = "w-full border border-slate-200 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 outline-none bg-white transition-shadow";
  const lCls = "block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1";

  return (
    <div className="space-y-4 anim-f">
      {/* Filter Bar */}
      <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div className="flex flex-wrap gap-3 items-center">
          <span className="font-bold text-sm text-slate-600 flex items-center gap-2"><i className="fas fa-filter text-blue-400"></i> Filter Presensi</span>
          {canEdit ? (
            <select className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white flex-1 min-w-[160px]" value={flLem} onChange={e=>setFlLem(e.target.value)}>
              <option value="">Semua Lembaga</option>
              {lembagaList.map(l=><option key={l} value={l}>{l}</option>)}
            </select>
          ) : (
            <div className="flex-1 border border-slate-200 px-3 py-2.5 rounded-lg bg-slate-50 text-sm text-slate-500 flex items-center gap-2 min-w-[160px]"><i className="fas fa-lock text-slate-300 text-xs"></i>{userLembaga||flLem}</div>
          )}
          <input type="text" placeholder="Cari Nama Pegawai..." className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[160px]" value={flNama} onChange={e=>setFlNama(e.target.value)} />
          {canLibur && <button onClick={()=>setShowRange(true)} className="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm flex items-center gap-2 transition-all shadow-sm shadow-purple-500/20"><i className="fas fa-calendar-alt"></i> Libur</button>}
          {isAdmin  && <button onClick={openAdd}            className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg font-bold text-sm flex items-center gap-2 transition-all shadow-sm shadow-emerald-500/20"><i className="fas fa-plus"></i> Tambah</button>}
        </div>
      </div>

      {/* Table */}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-left">
            <thead className="bg-gradient-to-r from-blue-700 to-blue-800 text-white text-xs">
              <tr>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider whitespace-nowrap">Waktu Presensi</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Lembaga</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Pegawai</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider text-center">Bukti/Map</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Status Radius</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Ket. Bukti</th>
                {isAdmin && <th className="px-4 py-3.5 font-bold uppercase tracking-wider text-center">Aksi</th>}
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {paged.map((item,i) => {
                const out  = isOutsideRadius(item.displayRadius);
                const late = checkLateStatus(item['Waktu'],item['Jenis Presensi']);
                const th   = isTidakHadir(item.displayRadius);
                const psw  = item.isPSW;
                let rCls = 'hover:bg-slate-50/50';
                if(psw)  rCls='row-psw';
                else if(th)   rCls='row-th';
                else if(out)  rCls='row-outside hover:opacity-90';
                else if(late) rCls='row-late hover:opacity-90';
                return (
                  <tr key={i} className={`${rCls} transition-colors`}>
                    <td className="px-4 py-3 whitespace-nowrap">
                      <span className="font-semibold text-xs block">{item['Waktu']}</span>
                      <span className={`mt-1 inline-block text-[9px] px-2 py-0.5 rounded font-black uppercase tracking-wider ${(item['Jenis Presensi']||'').toLowerCase()==='datang'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}`}>{item['Jenis Presensi']}</span>
                    </td>
                    <td className="px-4 py-3 text-xs">{item['Nama Lembaga']}</td>
                    <td className="px-4 py-3"><div className="font-bold text-xs">{item['Nama Pegawai']}</div><div className="text-[10px] text-slate-400 mt-0.5">{item['Nip']}</div></td>
                    <td className="px-4 py-3 text-center">
                      <div className="flex justify-center gap-2">
                        {canBukti ? <button onClick={()=>setModalImg(item['Bukti Dukung'])} className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center hover:bg-blue-100 transition-colors"><i className="fas fa-image text-xs"></i></button>
                          : <span className="w-8 h-8 rounded-lg bg-slate-50 text-slate-300 border border-slate-100 flex items-center justify-center"><i className="fas fa-lock text-xs"></i></span>}
                        <button onClick={()=>{ const la=normCoord(item.Latitude),lo=normCoord(item.Longitude); if(la&&lo) setModalMap({lat:la,lng:lo}); else Swal.fire('Info','Koordinat tidak tersedia','info'); }} className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center hover:bg-emerald-100 transition-colors"><i className="fas fa-map-marker-alt text-xs"></i></button>
                      </div>
                    </td>
                    <td className="px-4 py-3">
                      <span className={`inline-flex items-center gap-1 px-2 py-1 rounded text-[9px] font-black uppercase tracking-wider ${psw?'bg-green-600 text-white':th?'bg-slate-800 text-white':out?'bg-red-600 text-white':'bg-green-600 text-white'}`}>
                        <i className={`fas ${psw||(!th&&!out)?'fa-check-circle':th?'fa-times-circle':'fa-exclamation-circle'} text-[7px]`}></i>
                        {item.displayRadius}
                      </span>
                      {item['Jarak Absen']&&<div className="text-[10px] mt-1 text-slate-400">{item['Jarak Absen']}</div>}
                    </td>
                    <td className="px-4 py-3 min-w-[140px]">
                      {editingRow===item._rowIndex ? (
                        <div className="flex gap-1">
                          <input className="border border-blue-300 px-2 py-1 rounded-lg text-xs flex-1 focus:ring-2 focus:ring-blue-400 outline-none" value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveKet(item._rowIndex)} autoFocus />
                          <button onClick={()=>saveKet(item._rowIndex)} className="w-7 h-7 bg-green-600 text-white rounded-lg flex items-center justify-center hover:bg-green-700 transition-colors"><i className="fas fa-check text-[10px]"></i></button>
                          <button onClick={()=>setEditingRow(null)} className="w-7 h-7 bg-slate-200 text-slate-600 rounded-lg flex items-center justify-center hover:bg-slate-300 transition-colors"><i className="fas fa-times text-[10px]"></i></button>
                        </div>
                      ) : (
                        <div className="flex items-center justify-between gap-1 cursor-pointer group" onClick={()=>{ setEditingRow(item._rowIndex); setEditVal(item['Keterangan Bukti']||''); }}>
                          <span className="text-xs text-slate-500 truncate max-w-[100px]">{item['Keterangan Bukti']||<span className="italic text-slate-300">-</span>}</span>
                          <i className="fas fa-pencil-alt text-slate-200 group-hover:text-blue-400 text-[9px] transition-colors flex-shrink-0"></i>
                        </div>
                      )}
                    </td>
                    {isAdmin&&(
                      <td className="px-4 py-3 text-center">
                        <div className="flex gap-1.5 justify-center">
                          <button onClick={()=>openEdit(item)} className="w-8 h-8 bg-blue-50 text-blue-600 border border-blue-100 rounded-lg flex items-center justify-center hover:bg-blue-100 transition-colors"><i className="fas fa-edit text-xs"></i></button>
                          <button onClick={()=>delItem(item._rowIndex,item['Nama Pegawai'])} className="w-8 h-8 bg-red-50 text-red-600 border border-red-100 rounded-lg flex items-center justify-center hover:bg-red-100 transition-colors"><i className="fas fa-trash-alt text-xs"></i></button>
                        </div>
                      </td>
                    )}
                  </tr>
                );
              })}
              {paged.length===0&&<tr><td colSpan={isAdmin?7:6} className="text-center py-14 text-slate-300"><i className="fas fa-inbox text-4xl block mb-3"></i><span className="text-sm font-medium">Data tidak ditemukan</span></td></tr>}
            </tbody>
          </table>
        </div>
        <TablePagination currentPage={page} totalItems={total} rowsPerPage={rpp} onPageChange={setPage} onRowsPerPageChange={setRpp} />
      </div>

      {/* Modal Bukti */}
      {modalImg&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setModalImg(null)}><div className="relative max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}><div className="px-5 py-4 flex justify-between items-center bg-gradient-to-r from-blue-700 to-blue-800 text-white"><span className="font-bold text-sm flex items-center gap-2"><i className="fas fa-file-image text-blue-200"></i>Bukti Dukung Presensi</span><button onClick={()=>setModalImg(null)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 text-xl">×</button></div><div className="w-full h-[80vh] bg-slate-100 flex items-center justify-center">{modalImg.includes('drive.google.com')?<iframe src={`https://drive.google.com/file/d/${extractFileId(modalImg)}/preview`} className="w-full h-full" allow="autoplay" sandbox="allow-same-origin allow-scripts"></iframe>:<img src={modalImg} alt="Bukti" className="w-full h-full object-contain" onError={e=>{e.target.onerror=null;e.target.parentNode.innerHTML='<div class="flex flex-col items-center justify-center h-full p-8"><i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i><p class="text-slate-600 font-semibold">Gambar tidak dapat ditampilkan</p></div>';}} />}</div></div></div>}

      {/* Modal Map */}
      {modalMap&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setModalMap(null)}><div className="w-full max-w-3xl bg-white rounded-2xl overflow-hidden shadow-2xl" onClick={e=>e.stopPropagation()}><div className="px-5 py-4 flex justify-between items-center bg-gradient-to-r from-blue-700 to-blue-800 text-white"><span className="font-bold text-sm flex items-center gap-2"><i className="fas fa-map-marked-alt text-blue-200"></i>Lokasi Presensi</span><button onClick={()=>setModalMap(null)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 text-xl">×</button></div><iframe width="100%" height="450" frameBorder="0" style={{border:0}} src={`https://maps.google.com/maps?q=${modalMap.lat},${modalMap.lng}&z=16&output=embed`} allowFullScreen></iframe></div></div>}

      {/* Modal Libur */}
      {showRange&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setShowRange(false)}><div className="bg-white rounded-2xl shadow-2xl w-full max-w-md" onClick={e=>e.stopPropagation()}><div className="px-6 py-5 flex justify-between items-center bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-t-2xl"><span className="font-bold flex items-center gap-2"><i className="fas fa-calendar-alt"></i>Atur Libur Manual</span><button onClick={()=>setShowRange(false)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 text-xl">×</button></div><div className="p-6 space-y-4"><div className="grid grid-cols-2 gap-4"><div><label className={lCls}>Tgl Awal</label><input type="date" className={iCls} value={rStart} onChange={e=>setRStart(e.target.value)} /></div><div><label className={lCls}>Tgl Akhir</label><input type="date" className={iCls} value={rEnd} onChange={e=>setREnd(e.target.value)} /></div></div><div><label className={lCls}>Status</label><select className={iCls} value={rStat} onChange={e=>setRStat(e.target.value)}><option>Libur</option><option>Cuti Bersama</option><option>Izin</option><option>Sakit</option></select></div><div><label className={lCls}>Keterangan (opsional)</label><textarea className={iCls} rows="3" value={rKet} onChange={e=>setRKet(e.target.value)} placeholder="Contoh: Libur Hari Raya"></textarea></div><div className="flex justify-end gap-3 pt-3 border-t border-slate-100"><button onClick={()=>setShowRange(false)} className="px-5 py-2.5 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50">Batal</button><button onClick={async()=>{ if(!rStart||!rEnd){Swal.fire('Peringatan','Tanggal harus diisi','warning');return;} const la=Swal.fire({title:'Memproses...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()}); const r=await runGoogleScript('setStatusRentang',rStart,rEnd,rStat,rKet); la.close(); if(r.success){Swal.fire({icon:'success',title:'Berhasil',text:`${r.updated} data diupdate`});setShowRange(false);refreshData();}else Swal.fire('Error','Gagal','error'); }} className="px-5 py-2.5 bg-purple-600 text-white rounded-xl text-sm font-bold hover:bg-purple-700">Terapkan</button></div></div></div></div>}

      {/* CRUD Modal */}
      {showCRUD&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setShowCRUD(false)}><div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}><div className="px-6 py-5 flex justify-between items-center bg-gradient-to-r from-blue-700 to-blue-800 text-white sticky top-0 rounded-t-2xl"><span className="font-bold flex items-center gap-2"><i className={`fas ${cMode==='add'?'fa-plus-circle':'fa-edit'} text-blue-200`}></i>{cMode==='add'?'Tambah Presensi Baru':'Edit Data Presensi'}</span><button onClick={()=>setShowCRUD(false)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 text-xl">×</button></div><div className="p-6 space-y-4"><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label className={lCls}>Hari Tanggal</label><input type="text" value={fv['Hari Tanggal']} onChange={e=>setFv({...fv,'Hari Tanggal':e.target.value})} className={iCls} /></div><div><label className={lCls}>Waktu *</label><input type="text" value={fv['Waktu']} onChange={e=>setFv({...fv,'Waktu':e.target.value})} className={iCls} required /></div><div><label className={lCls}>Jenis Presensi *</label><select value={fv['Jenis Presensi']} onChange={e=>setFv({...fv,'Jenis Presensi':e.target.value})} className={iCls} required><option value="">-- Pilih --</option><option>Datang</option><option>Pulang</option></select></div>
              <div><label className={lCls}>Nama Lembaga</label><select value={fv['Nama Lembaga']} onChange={e=>setFv({...fv,'Nama Lembaga':e.target.value})} className={iCls}><option value="">-- Pilih Lembaga --</option>{lembagaList.map(l=><option key={l} value={l}>{l}</option>)}</select></div>
              <div><label className={lCls}>Nama Pegawai *</label><input type="text" value={fv['Nama Pegawai']} onChange={e=>setFv({...fv,'Nama Pegawai':e.target.value})} className={iCls} required /></div><div><label className={lCls}>NIP</label><input type="text" value={fv['Nip']} onChange={e=>setFv({...fv,'Nip':e.target.value})} className={iCls} /></div><div className="md:col-span-2"><label className={lCls}>Bukti Dukung (URL)</label><input type="text" value={fv['Bukti Dukung']} onChange={e=>setFv({...fv,'Bukti Dukung':e.target.value})} className={iCls} /></div><div><label className={lCls}>Latitude</label><input type="text" value={fv['Latitude']} onChange={e=>setFv({...fv,'Latitude':e.target.value})} className={iCls} /></div><div><label className={lCls}>Longitude</label><input type="text" value={fv['Longitude']} onChange={e=>setFv({...fv,'Longitude':e.target.value})} className={iCls} /></div><div><label className={lCls}>Jarak Absen</label><input type="text" value={fv['Jarak Absen']} onChange={e=>setFv({...fv,'Jarak Absen':e.target.value})} className={iCls} /></div>
              <div><label className={lCls}>Keterangan Radius</label><select value={fv['Keterangan Radius']} onChange={e=>setFv({...fv,'Keterangan Radius':e.target.value})} className={iCls}><option value="">-- Pilih Status --</option><option value="Dalam Radius">Dalam Radius</option><option value="Luar Radius">Luar Radius</option><option value="Tidak Hadir">Tidak Hadir</option><option value="Hari Libur">Hari Libur</option><option value="Cuti Bersama">Cuti Bersama</option></select></div>
              <div className="md:col-span-2"><label className={lCls}>Keterangan Bukti</label><input type="text" value={fv['Keterangan Bukti']} onChange={e=>setFv({...fv,'Keterangan Bukti':e.target.value})} className={iCls} /></div></div><div className="flex justify-end gap-3 pt-4 border-t border-slate-100"><button onClick={()=>setShowCRUD(false)} className="px-5 py-2.5 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50">Batal</button><button onClick={submitCRUD} className="px-6 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 flex items-center gap-2"><i className="fas fa-save"></i>Simpan</button></div></div></div></div>}
    </div>
  );
};

// ── DOKUMEN IJIN ───────────────────────────────────────────────
const DokumenIjin = ({ data, refreshData, userRole, userLembaga }) => {
  const [modalPdf,setModalPdf]=useState(null);
  const [flLem,setFlLem]=useState(''), [flNama,setFlNama]=useState('');
  const [page,setPage]=useState(1), [rpp,setRpp]=useState(10);
  const [statOver,setStatOver]=useState({}); 
  const [savingStat,setSavingStat]=useState(null);
  const [ketEdit,setKetEdit]=useState(null);
  const [ketVals,setKetVals]=useState({});
  const [savingKet,setSavingKet]=useState(null);

  const canEditLem = userRole==='Admin'||userRole==='User'||userRole==='Superuser';
  const canEdit    = userRole==='Admin'||userRole==='User'||userRole==='Superuser';

  useEffect(()=>{ if(!canEditLem&&userLembaga) setFlLem(userLembaga); },[canEditLem,userLembaga]);
  const filtered = useMemo(()=>data.filter(i=>(i['Nama Lembaga']||'').toLowerCase().includes(flLem.toLowerCase())&&(i['Nama Pegawai']||'').toLowerCase().includes(flNama.toLowerCase())),[data,flLem,flNama]);
  useEffect(()=>setPage(1),[flLem,flNama]);
  const total = filtered.length;
  useEffect(()=>{ if(rpp>total&&total>0) setRpp(total); else if(total===0) setRpp(10); },[total,rpp]);
  const eff   = rpp===total?total:rpp;
  const paged = filtered.slice((page-1)*eff, page*eff);

  const normStat = s => {
    if (!s) return 'Diajukan';
    const l = s.toLowerCase();
    if (l==='disetujui') return 'Disetujui';
    if (l==='ditolak')   return 'Ditolak';
    return 'Diajukan';
  };
  const getDisplayStat = item => statOver[item._rowIndex]!==undefined ? statOver[item._rowIndex] : normStat(item.Status);

  const handleStatClick = async (rowIndex, newStat, currentKet) => {
    setStatOver(p=>({...p,[rowIndex]:newStat}));
    setSavingStat(rowIndex);
    try {
      const r = await runGoogleScript('updateDokumenIjin', rowIndex, newStat, currentKet||'');
      if(r&&r.success){
        Swal.fire({icon:'success',title:'Status diperbarui',timer:700,showConfirmButton:false,toast:true,position:'top-end'});
        refreshData();
      } else {
        setStatOver(p=>{const n={...p};delete n[rowIndex];return n;}); 
        Swal.fire('Error','Gagal memperbarui status','error');
      }
    } catch { setStatOver(p=>{const n={...p};delete n[rowIndex];return n;}); }
    setSavingStat(null);
  };

  const handleKetSave = async (rowIndex, currentStat) => {
    const newKet = ketVals[rowIndex]!==undefined ? ketVals[rowIndex] : '';
    setSavingKet(rowIndex);
    try {
      const r = await runGoogleScript('updateDokumenIjin', rowIndex, currentStat||'Diajukan', newKet);
      if(r&&r.success){
        Swal.fire({icon:'success',title:'Keterangan disimpan',timer:700,showConfirmButton:false,toast:true,position:'top-end'});
        refreshData();
      } else Swal.fire('Error','Gagal menyimpan keterangan','error');
    } catch {}
    setSavingKet(null); setKetEdit(null);
  };

  const delItem = async (idx,nm) => {
    const c = await Swal.fire({title:'Hapus Dokumen Ijin?',text:`Yakin hapus pengajuan ${nm}?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#334155',confirmButtonText:'Ya, Hapus'});
    if(c.isConfirmed){ const r=await runGoogleScript('deleteDokumenIjin',idx); if(r.success){Swal.fire({icon:'success',title:'Terhapus',timer:1200,showConfirmButton:false});refreshData();}else Swal.fire('Error','Gagal','error'); }
  };

  const STATS = ['Diajukan','Disetujui','Ditolak'];
  const statColor = s => s==='Disetujui'?'bg-green-600 text-white border-green-600':s==='Ditolak'?'bg-red-600 text-white border-red-600':'bg-blue-600 text-white border-blue-600';

  return (
    <div className="space-y-4 anim-f">
      <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <div className="flex flex-wrap gap-3 items-center">
          <span className="font-bold text-sm text-slate-600 flex items-center gap-2"><i className="fas fa-filter text-blue-400"></i>Filter Dokumen Ijin</span>
          {canEditLem ? (
            <select className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white flex-1 min-w-[160px]" value={flLem} onChange={e=>setFlLem(e.target.value)}>
              <option value="">Semua Lembaga</option>
              {lembagaList.map(l=><option key={l} value={l}>{l}</option>)}
            </select>
          ) : (
            <div className="flex-1 border border-slate-200 px-3 py-2.5 rounded-lg bg-slate-50 text-sm text-slate-500 flex items-center gap-2 min-w-[160px]"><i className="fas fa-lock text-slate-300 text-xs"></i>{userLembaga||flLem}</div>
          )}
          <input type="text" placeholder="Cari Nama Pegawai..." className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[160px]" value={flNama} onChange={e=>setFlNama(e.target.value)} />
        </div>
      </div>
      {canEdit&&<div className="bg-blue-50 border border-blue-100 rounded-xl px-4 py-2.5 flex items-center gap-3"><i className="fas fa-info-circle text-blue-400 text-sm"></i><p className="text-xs text-blue-600 font-medium">Klik tombol status untuk menyimpan otomatis. Klik kolom Keterangan lalu tekan Enter atau klik di luar untuk menyimpan.</p></div>}
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-left">
            <thead className="bg-gradient-to-r from-blue-700 to-blue-800 text-white text-xs">
              <tr>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Nama Pegawai</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Jenis Ijin</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider whitespace-nowrap">Tgl Awal</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider whitespace-nowrap">Tgl Akhir</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider text-center">File</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider min-w-[220px]">Status</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider min-w-[140px]">Keterangan</th>
                {canEdit&&<th className="px-4 py-3.5 font-bold uppercase tracking-wider text-center">Hapus</th>}
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {paged.map((item,i) => {
                const curStat  = getDisplayStat(item);
                const isSaving = savingStat===item._rowIndex;
                const isKEdit  = ketEdit===item._rowIndex;
                const isKSave  = savingKet===item._rowIndex;
                return (
                  <tr key={i} className={`hover:bg-slate-50/50 transition-colors ${isSaving?'opacity-60':''}`}>
                    <td className="px-4 py-3"><div className="font-bold text-xs">{item['Nama Pegawai']}</div><div className="text-[10px] text-slate-400 mt-0.5">{item['Nama Lembaga']}</div></td>
                    <td className="px-4 py-3">
                      <span className={`inline-flex items-center gap-1 px-2 py-1 rounded text-[10px] font-bold ${item['Jenis Ijin']==='Dinas Luar'?'bg-indigo-100 text-indigo-700':item['Jenis Ijin']==='Sakit'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}`}>
                        <i className={`fas ${item['Jenis Ijin']==='Sakit'?'fa-heartbeat':item['Jenis Ijin']==='Dinas Luar'?'fa-car':'fa-envelope'} text-[8px]`}></i>
                        {item['Jenis Ijin']}
                      </span>
                    </td>
                    <td className="px-4 py-3 text-xs text-slate-600 whitespace-nowrap">{item['Tanggal Awal']||'-'}</td>
                    <td className="px-4 py-3 text-xs text-slate-600 whitespace-nowrap">{item['Tanggal Berakir']||'-'}</td>
                    <td className="px-4 py-3 text-center"><button onClick={()=>setModalPdf(item['File URL'])} className="inline-flex items-center gap-1 bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold hover:bg-red-700 transition-colors shadow-sm"><i className="fas fa-file-pdf"></i>PDF</button></td>
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        {STATS.map(s => {
                          const sel = curStat===s;
                          return (
                            <button key={s}
                              onClick={()=>canEdit&&!isSaving&&handleStatClick(item._rowIndex,s,item.Keterangan)}
                              disabled={!canEdit||isSaving}
                              title={`Set: ${s}`}
                              className={`px-2.5 py-1 rounded-full text-[10px] font-bold border transition-all ${sel?statColor(s):'bg-white text-slate-400 border-slate-200 hover:border-slate-300 hover:bg-slate-50'} ${(!canEdit||isSaving)?'cursor-default opacity-60':'cursor-pointer'}`}>
                              {sel&&<i className="fas fa-check mr-1 text-[8px]"></i>}{s}
                            </button>
                          );
                        })}
                        {isSaving&&<i className="fas fa-spinner fa-spin text-xs text-slate-300 ml-1"></i>}
                      </div>
                    </td>
                    <td className="px-4 py-3">
                      {isKEdit ? (
                        <div className="flex items-center gap-1">
                          <input type="text" autoFocus
                            className="flex-1 border border-blue-300 px-2 py-1 rounded-lg text-xs focus:ring-2 focus:ring-blue-400 outline-none"
                            value={ketVals[item._rowIndex]!==undefined?ketVals[item._rowIndex]:(item.Keterangan||'')}
                            onChange={e=>setKetVals(p=>({...p,[item._rowIndex]:e.target.value}))}
                            onBlur={()=>handleKetSave(item._rowIndex,curStat)}
                            onKeyDown={e=>{ if(e.key==='Enter') handleKetSave(item._rowIndex,curStat); if(e.key==='Escape') setKetEdit(null); }}
                          />
                          {isKSave&&<i className="fas fa-spinner fa-spin text-xs text-slate-300"></i>}
                        </div>
                      ) : (
                        <div className={`flex items-center gap-1.5 group ${canEdit?'cursor-pointer':'cursor-default'}`}
                          onClick={()=>{ if(!canEdit)return; setKetEdit(item._rowIndex); setKetVals(p=>({...p,[item._rowIndex]:item.Keterangan||''})); }}>
                          <span className="text-xs text-slate-500 italic flex-1">{item.Keterangan||<span className="text-slate-300">Tambah catatan...</span>}</span>
                          {canEdit&&<i className="fas fa-pencil-alt text-slate-200 group-hover:text-blue-400 text-[9px] transition-colors flex-shrink-0"></i>}
                        </div>
                      )}
                    </td>
                    {canEdit&&<td className="px-4 py-3 text-center"><button onClick={()=>delItem(item._rowIndex,item['Nama Pegawai'])} className="w-8 h-8 bg-red-50 text-red-500 border border-red-100 rounded-lg flex items-center justify-center hover:bg-red-100 transition-colors mx-auto"><i className="fas fa-trash-alt text-xs"></i></button></td>}
                  </tr>
                );
              })}
              {paged.length===0&&<tr><td colSpan={canEdit?8:7} className="text-center py-14 text-slate-300"><i className="fas fa-folder-open text-4xl block mb-3"></i><span className="text-sm font-medium">Tidak ada data dokumen ijin</span></td></tr>}
            </tbody>
          </table>
        </div>
        <TablePagination currentPage={page} totalItems={total} rowsPerPage={rpp} onPageChange={setPage} onRowsPerPageChange={setRpp} />
      </div>
      {modalPdf&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={()=>setModalPdf(null)}><div className="w-full max-w-5xl h-[90vh] bg-white rounded-2xl overflow-hidden flex flex-col shadow-2xl" onClick={e=>e.stopPropagation()}><div className="px-5 py-4 flex justify-between items-center bg-gradient-to-r from-blue-700 to-blue-800 text-white"><span className="font-bold text-sm flex items-center gap-2"><i className="fas fa-file-pdf text-red-300"></i>Pratinjau Dokumen PSW</span><button onClick={()=>setModalPdf(null)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/20 text-xl">×</button></div><iframe src={modalPdf.replace('/view','/preview')} className="flex-1 w-full border-none" sandbox="allow-same-origin allow-scripts"></iframe></div></div>}
    </div>
  );
};

// ── DATABASE PEGAWAI ────────────────────────────────────────────
const DatabasePegawai = ({ refreshParent, userRole }) => {
  const [data,setData]=useState([]), [load,setLoad]=useState(false);
  const [flLem,setFlLem]=useState(''), [flNama,setFlNama]=useState('');
  const [modal,setModal]=useState(false), [editRow,setEditRow]=useState(null);
  const [fd,setFd]=useState({'Username (MP/ID)':'','Password':'','Name Lembaga':'','Name Pegawai':'','Latitude':'','Longitude':'','Radius (m)':'','Role':''});
  const [page,setPage]=useState(1), [rpp,setRpp]=useState(10);
  const canM = userRole==='Admin'||userRole==='Superuser';
  const fetch = async()=>{ setLoad(true); const r=await runGoogleScript('getPegawai'); setData(r||[]); setLoad(false); };
  useEffect(()=>{ fetch(); },[]);
  const filtered = useMemo(()=>data.filter(i=>(i['Name Lembaga']||'').toLowerCase().includes(flLem.toLowerCase())&&(i['Name Pegawai']||'').toLowerCase().includes(flNama.toLowerCase())),[data,flLem,flNama]);
  useEffect(()=>setPage(1),[flLem,flNama]);
  const total=filtered.length;
  useEffect(()=>{ if(rpp>total&&total>0) setRpp(total); else if(total===0) setRpp(10); },[total,rpp]);
  const eff=rpp===total?total:rpp;
  const paged=filtered.slice((page-1)*eff,page*eff);
  const openMod=item=>{
    if(!canM){Swal.fire('Akses Ditolak','Hanya Admin/Superuser','warning');return;}
    if(item){setFd({'Username (MP/ID)':item['Username (MP/ID)']||'','Password':item['Password']||'','Name Lembaga':item['Name Lembaga']||'','Name Pegawai':item['Name Pegawai']||'','Latitude':item['Latitude']||'','Longitude':item['Longitude']||'','Radius (m)':item['Radius (m)']||'','Role':item['Role']||''});setEditRow(item._rowIndex);}
    else{setFd({'Username (MP/ID)':'','Password':'','Name Lembaga':'','Name Pegawai':'','Latitude':'','Longitude':'','Radius (m)':'','Role':''});setEditRow(null);}
    setModal(true);
  };
  const save=async()=>{
    if(!fd['Username (MP/ID)']||!fd['Password']||!fd['Name Pegawai']){Swal.fire('Peringatan','Username, Password, Nama Pegawai wajib','warning');return;}
    setLoad(true);
    const r=editRow?await runGoogleScript('updatePegawai',editRow,fd):await runGoogleScript('addPegawai',fd);
    if(r.success){Swal.fire({icon:'success',title:'Berhasil',timer:1200,showConfirmButton:false});setModal(false);fetch();if(refreshParent)refreshParent();}
    else Swal.fire('Error','Gagal menyimpan','error');
    setLoad(false);
  };
  const del=async(idx,nm)=>{
    if(!canM){Swal.fire('Akses Ditolak','Hanya Admin/Superuser','warning');return;}
    const c=await Swal.fire({title:'Hapus Pegawai?',text:`Yakin hapus ${nm}?`,icon:'warning',showCancelButton:true,confirmButtonColor:'#d33',cancelButtonColor:'#334155',confirmButtonText:'Ya, Hapus'});
    if(c.isConfirmed){setLoad(true);const r=await runGoogleScript('deletePegawai',idx);if(r.success){Swal.fire({icon:'success',title:'Terhapus',timer:1200,showConfirmButton:false});fetch();}else Swal.fire('Error','Gagal','error');setLoad(false);}
  };
  const iCls="w-full border border-slate-200 px-3 py-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 outline-none bg-white";
  const lCls="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-1";
  return (
    <div className="space-y-4 anim-f">
      <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap justify-between items-center gap-4">
        <div><h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><i className="fas fa-database text-blue-600"></i>Database Pegawai</h3><p className="text-xs text-slate-400 mt-0.5">{total} pegawai</p></div>
        {canM?<button onClick={()=>openMod()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-sm"><i className="fas fa-plus-circle"></i>Tambah Pegawai</button>:<div className="text-xs text-red-500 bg-red-50 px-4 py-2 rounded-xl border border-red-100 flex items-center gap-2"><i className="fas fa-lock"></i>Hanya Admin/Superuser</div>}
      </div>
      <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap gap-3">
        <select className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white flex-1 min-w-[160px]" value={flLem} onChange={e=>setFlLem(e.target.value)}><option value="">Semua Lembaga</option>{lembagaList.map(l=><option key={l} value={l}>{l}</option>)}</select>
        <input type="text" placeholder="Cari Nama Pegawai..." className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[160px]" value={flNama} onChange={e=>setFlNama(e.target.value)} />
      </div>
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-left">
            <thead className="bg-gradient-to-r from-blue-700 to-blue-800 text-white text-xs">
              <tr>{['Username','Password','Lembaga','Nama Pegawai','Latitude','Longitude','Radius','Role'].map(h=><th key={h} className="px-4 py-3.5 font-bold uppercase tracking-wider">{h}</th>)}{canM&&<th className="px-4 py-3.5 font-bold uppercase tracking-wider text-center">Aksi</th>}</tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {paged.map((item,i)=>(
                <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                  <td className="px-4 py-3 text-xs font-medium text-blue-700">{item['Username (MP/ID)']}</td>
                  <td className="px-4 py-3 text-xs text-slate-400 font-mono tracking-widest">••••••</td>
                  <td className="px-4 py-3 text-xs">{item['Name Lembaga']}</td>
                  <td className="px-4 py-3 font-bold text-xs">{item['Name Pegawai']}</td>
                  <td className="px-4 py-3 text-xs font-mono text-slate-400">{item['Latitude']}</td>
                  <td className="px-4 py-3 text-xs font-mono text-slate-400">{item['Longitude']}</td>
                  <td className="px-4 py-3 text-xs">{item['Radius (m)']} m</td>
                  <td className="px-4 py-3"><span className={`inline-block px-2 py-0.5 rounded text-[9px] font-black uppercase ${item['Role']==='Admin'?'bg-red-100 text-red-700':item['Role']==='Superuser'?'bg-purple-100 text-purple-700':item['Role']==='User'?'bg-blue-100 text-blue-700':'bg-slate-100 text-slate-600'}`}>{item['Role']}</span></td>
                  {canM&&<td className="px-4 py-3"><div className="flex justify-center gap-1.5"><button onClick={()=>openMod(item)} className="w-8 h-8 bg-blue-50 text-blue-600 border border-blue-100 rounded-lg flex items-center justify-center hover:bg-blue-100 transition-colors"><i className="fas fa-edit text-xs"></i></button><button onClick={()=>del(item._rowIndex,item['Name Pegawai'])} className="w-8 h-8 bg-red-50 text-red-600 border border-red-100 rounded-lg flex items-center justify-center hover:bg-red-100 transition-colors"><i className="fas fa-trash-alt text-xs"></i></button></div></td>}
                </tr>
              ))}
              {paged.length===0&&<tr><td colSpan={canM?9:8} className="text-center py-14 text-slate-300"><i className="fas fa-users text-4xl block mb-3"></i><span className="text-sm">Tidak ada data</span></td></tr>}
            </tbody>
          </table>
        </div>
        <TablePagination currentPage={page} totalItems={total} rowsPerPage={rpp} onPageChange={setPage} onRowsPerPageChange={setRpp} />
      </div>

// ── MONITORING EXPORT ───────────────────────────────────────────
const MonitoringExport = ({ presensiData, ijinData, pegawaiData, refreshData, userRole }) => {

    else if(dEnd)  { const e=dateToNumber(parseIjinDate(dEnd));   if(e) f=f.filter(i=>{ const n=dateToNumber(parsePresensiDate(i['Waktu'])); return n<=e; }); }
    return f;

  const exTime  = w => { if(!w) return null; const m=w.match(/pukul\s*([\d\.\:]+)/i); return m?m[1]:null; };
  const pswActive = (nm,dt) => {
    if(!ijinData) return false;
    const app=ijinData.filter(ij=>ij.Status&&ij.Status.toLowerCase()==='disetujui');
    const nn=normalizeName(nm);
    return app.some(ij=>{ if(normalizeName(ij['Nama Pegawai']||'')!==nn) return false; const s=parseIjinDate(ij['Tanggal Awal']),e=parseIjinDate(ij['Tanggal Berakir']); if(!s||!e) return false; return isDateInRange(dt,s,e); });
  };
  const pswJenis = (nm,dt) => {
    if(!ijinData) return null;
    const app=ijinData.filter(ij=>ij.Status&&ij.Status.toLowerCase()==='disetujui');
    const nn=normalizeName(nm);
    const m=app.find(ij=>{ if(normalizeName(ij['Nama Pegawai']||'')!==nn) return false; const s=parseIjinDate(ij['Tanggal Awal']),e=parseIjinDate(ij['Tanggal Berakir']); if(!s||!e) return false; return isDateInRange(dt,s,e); });

      let cur=new Date(s0);

              <h4 className="font-bold text-slate-800 text-sm mb-2">{h}</h4>
              <p className="text-xs text-slate-500 mb-5 flex-1">{d}</p>
              <button onClick={fn} className={`w-full ${btn} text-white py-3 rounded-xl font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-all`}><i className={`fas ${bi}`}></i>{bl}</button>
            </div>
          ))}

      ) : <div className="bg-slate-50 p-8 rounded-2xl border border-slate-200 text-center"><i className="fas fa-lock text-3xl text-slate-300 mb-3 block"></i><p className="text-slate-400 text-sm">Tidak memiliki akses untuk mengekspor laporan.</p></div>}
      <div className="bg-red-50 border border-red-100 rounded-2xl p-5"><div className="flex items-start gap-4"><div className="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center flex-shrink-0"><i className="fas fa-skull-crossbones text-red-600"></i></div><div className="flex-1"><h4 className="font-bold text-red-800 mb-1 text-sm">Zona Berbahaya</h4><p className="text-xs text-red-500">Menghapus semua data <strong>Presensi</strong>. Aksi ini <strong>permanen</strong>. {!isAdmin&&<span className="font-bold">* Hanya Admin.</span>}</p></div>{isAdmin?<button onClick={handleReset} className="flex-shrink-0 border-2 border-red-500 text-red-600 hover:bg-red-600 hover:text-white px-4 py-2 rounded-xl font-black text-xs transition-all flex items-center gap-2"><i className="fas fa-trash-alt"></i>RESET</button>:<button disabled className="flex-shrink-0 border-2 border-slate-300 text-slate-400 bg-slate-100 px-4 py-2 rounded-xl font-black text-xs cursor-not-allowed flex items-center gap-2"><i className="fas fa-lock"></i>RESET</button>}</div></div>

// ── ACTIVITY LOG ─────────────────────────
const ActivityLog = ({ userRole }) => {
  const [logs,setLogs]=useState([]), [load,setLoad]=useState(false);
  const [flUser,setFlUser]=useState(''), [flAct,setFlAct]=useState('');
  const [dS,setDS]=useState(''), [dE,setDE]=useState('');
  const [page,setPage]=useState(1), [rpp,setRpp]=useState(10);
  const canView = userRole==='Admin';
  const fetchLogs = async()=>{ if(!canView) return; setLoad(true); const r=await runGoogleScript('getActivityLogs'); setLogs(r||[]); setLoad(false); };
  useEffect(()=>{ if(canView) fetchLogs(); },[canView]);
  const filtered = useMemo(()=>{
    let r=logs;
    if(flUser) r=r.filter(l=>(l.Username||'').toLowerCase().includes(flUser.toLowerCase()));
    if(flAct)  r=r.filter(l=>(l.Action||'').toLowerCase().includes(flAct.toLowerCase()));
    if(dS){ const s=new Date(dS); s.setHours(0,0,0,0); r=r.filter(l=>new Date(l.Timestamp)>=s); }
    if(dE){ const e=new Date(dE); e.setHours(23,59,59,999); r=r.filter(l=>new Date(l.Timestamp)<=e); }
    return r;
  },[logs,flUser,flAct,dS,dE]);
  const total=filtered.length, eff=rpp===total?total:rpp;
  const paged=filtered.slice((page-1)*eff, page*eff);
  if(!canView) return <div className="bg-white p-12 rounded-2xl shadow-sm border border-slate-100 text-center"><div className="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-4"><i className="fas fa-lock text-3xl text-slate-300"></i></div><h3 className="text-lg font-bold text-slate-700">Akses Ditolak</h3><p className="text-slate-400 text-sm mt-2">Log aktivitas hanya untuk Admin.</p></div>;
  return (
    <div className="space-y-4 anim-f">
      <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100"><h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><span className="w-8 h-8 bg-slate-50 rounded-lg flex items-center justify-center"><i className="fas fa-history text-blue-600 text-sm"></i></span>Log Monitoring Aktivitas</h3><p className="text-xs text-slate-400 mt-1 ml-10">Riwayat login dan aktivitas pengguna sistem.</p></div>
      <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-wrap gap-3 items-center">
        <input type="text" placeholder="Cari Username..." className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[120px]" value={flUser} onChange={e=>setFlUser(e.target.value)} />
        <input type="text" placeholder="Cari Aksi..." className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 flex-1 min-w-[100px]" value={flAct} onChange={e=>setFlAct(e.target.value)} />
        <input type="date" className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" value={dS} onChange={e=>setDS(e.target.value)} />
        <input type="date" className="border border-slate-200 px-3 py-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400" value={dE} onChange={e=>setDE(e.target.value)} />
        <button onClick={()=>{setFlUser('');setFlAct('');setDS('');setDE('');}} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-semibold transition-colors"><i className="fas fa-undo mr-1.5"></i>Reset</button>
        <button onClick={fetchLogs} disabled={load} className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 disabled:opacity-60"><i className={`fas fa-sync-alt ${load?'fa-spin':''}`}></i>Refresh</button>
      </div>
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-left">
            <thead className="bg-gradient-to-r from-blue-700 to-blue-800 text-white text-xs">
              <tr>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider whitespace-nowrap">Tanggal & Waktu</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Username</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Role</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Aksi</th>
                <th className="px-4 py-3.5 font-bold uppercase tracking-wider">Detail</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {paged.length>0 ? paged.map((log,i)=>(
                <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                  <td className="px-4 py-3 whitespace-nowrap"><span className="text-xs font-mono bg-slate-50 border border-slate-100 px-2 py-1 rounded-md text-slate-600">{fmtTs(log.Timestamp)}</span></td>
                  <td className="px-4 py-3 font-semibold text-xs">{log.Username||'-'}</td>
                  <td className="px-4 py-3"><span className="inline-block px-2 py-0.5 rounded text-[9px] font-black uppercase bg-slate-100 text-slate-600">{log.Role||'-'}</span></td>
                  <td className="px-4 py-3"><span className={`inline-flex items-center gap-1 px-2 py-1 rounded text-[9px] font-black uppercase ${log.Action==='login'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}><i className={`fas ${log.Action==='login'?'fa-sign-in-alt':'fa-sign-out-alt'} text-[7px]`}></i>{log.Action||'-'}</span></td>
                  <td className="px-4 py-3 text-xs text-slate-500">{log.Details||'-'}</td>
                </tr>
              )) : <tr><td colSpan="5" className="text-center py-14 text-slate-300"><i className="fas fa-scroll text-4xl block mb-3"></i><span className="text-sm font-medium">{load?'Memuat data...':'Tidak ada log aktivitas'}</span></td></tr>}
            </tbody>
          </table>
        </div>
        {total>0&&<TablePagination currentPage={page} totalItems={total} rowsPerPage={rpp} onPageChange={setPage} onRowsPerPageChange={v=>{setRpp(v);setPage(1);}} />}
      </div>
    </div>
  );
};

// ── PENGAJUAN PSW ───────────────────────────────────────────────
const PengajuanPSW = ({ user }) => {
  const [pegList,setPegList]=useState([]);
  const [fd,setFd]=useState({nip:'',jenis:'',tglAwal:'',tglAkhir:''});
  const [file,setFile]=useState(null), [load,setLoad]=useState(false);
  useEffect(()=>{ const f=async()=>{ if(!user||!user.lembaga) return; const r=await runGoogleScript('getPegawaiByLembaga',user.lembaga); setPegList(Array.isArray(r)?r:[]); }; f(); },[user]);
  const onFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.type!=='application/pdf'){Swal.fire('Format Salah','Hanya PDF diizinkan.','warning');e.target.value='';return;}
    if(f.size>5*1024*1024){Swal.fire('Terlalu Besar','Maks 5MB.','warning');e.target.value='';return;}
    const r=new FileReader(); r.onload=()=>setFile({name:f.name,base64:r.result}); r.readAsDataURL(f);
  };
  const submit=async e=>{
    e.preventDefault();
    if(!file){Swal.fire('Peringatan','Lampirkan PDF.','warning');return;}
    if(!fd.nip||!fd.jenis||!fd.tglAwal||!fd.tglAkhir){Swal.fire('Peringatan','Semua field wajib diisi.','warning');return;}
    const pg=pegList.find(p=>p.nip===fd.nip); if(!pg){Swal.fire('Error','Pegawai tidak ditemukan.','error');return;}
    setLoad(true);
    const r=await runGoogleScript('submitPengajuan',{lembaga:user.lembaga,namaPegawai:pg.nama,nip:pg.nip,jenis:fd.jenis,tglAwal:fd.tglAwal,tglAkhir:fd.tglAkhir,fileName:file.name,fileBase64:file.base64});
    setLoad(false);
    if(r.success){Swal.fire({icon:'success',title:'Terkirim',text:'Pengajuan berhasil diteruskan ke Korwil.',confirmButtonColor:'#2563eb'});setFd({nip:'',jenis:'',tglAwal:'',tglAkhir:''});setFile(null);document.getElementById('fileInput').value='';}
    else Swal.fire('Gagal',r.message,'error');
  };
  return (
    <div className="anim-f">
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div className="px-6 py-5 border-b border-slate-100 bg-gradient-to-r from-blue-50 to-indigo-50 flex items-center gap-4">
          <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-md shadow-blue-500/25 flex-shrink-0"><i className="fas fa-file-upload text-white"></i></div>
          <div><h3 className="font-black text-slate-800">Form Pengajuan PSW</h3><p className="text-xs text-slate-500 mt-0.5">Lembaga: <span className="font-bold text-blue-600">{user.lembaga}</span></p></div>
        </div>
        <form onSubmit={submit} className="p-6 md:p-8 space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="md:col-span-2"><label className="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2">Pilih Pegawai *</label><select required value={fd.nip} onChange={e=>setFd({...fd,nip:e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-400 outline-none"><option value="" disabled>-- Pilih Pegawai --</option>{pegList.map(p=><option key={p.nip} value={p.nip}>{p.nama} (NIP: {p.nip})</option>)}</select></div>
            <div className="md:col-span-2">
              <label className="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-3">Kategori Pengajuan *</label>
              <div className="grid grid-cols-3 gap-4">
                {[{v:'Sakit',ic:'fa-heartbeat',c:'rose'},{v:'Ijin',ic:'fa-envelope-open-text',c:'amber'},{v:'Dinas Luar',ic:'fa-car-side',c:'blue'}].map(({v,ic,c})=>{
                  const sel=fd.jenis===v;
                  return <label key={v} className={`cursor-pointer border-2 rounded-2xl p-4 flex flex-col items-center justify-center transition-all ${sel?`border-${c}-500 bg-${c}-50`:'border-slate-100 bg-white hover:border-slate-200 hover:bg-slate-50'}`}><input type="radio" name="jenis" value={v} className="hidden" checked={sel} onChange={e=>setFd({...fd,jenis:e.target.value})} required /><div className={`w-11 h-11 rounded-full mb-3 flex items-center justify-center text-xl ${sel?`bg-${c}-100 text-${c}-600`:'bg-slate-100 text-slate-400'}`}><i className={`fas ${ic}`}></i></div><span className={`font-bold text-sm ${sel?`text-${c}-700`:'text-slate-500'}`}>{v}</span></label>;
                })}
              </div>
            </div>
            <div><label className="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2">Tanggal Mulai *</label><input type="date" required value={fd.tglAwal} onChange={e=>setFd({...fd,tglAwal:e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-400 outline-none" /></div>
            <div><label className="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2">Tanggal Selesai *</label><input type="date" required min={fd.tglAwal} value={fd.tglAkhir} onChange={e=>setFd({...fd,tglAkhir:e.target.value})} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-400 outline-none" /></div>
            <div className="md:col-span-2">
              <label className="block text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2">Lampiran Bukti Dukung PDF *</label>
              <div className={`border-2 border-dashed rounded-2xl p-8 flex flex-col items-center justify-center transition-all relative cursor-pointer ${file?'border-green-400 bg-green-50':'border-slate-200 bg-slate-50 hover:bg-slate-100 hover:border-slate-300'}`}>
                <input id="fileInput" type="file" accept=".pdf" onChange={onFile} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" required={!file} />
                {file ? <div className="text-center"><div className="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"><i className="fas fa-file-check"></i></div><p className="font-bold text-slate-800 text-sm">{file.name}</p><p className="text-xs text-green-600 mt-1.5 font-medium">Siap diunggah — klik untuk mengganti</p></div>
                  : <div className="text-center"><div className="w-14 h-14 bg-blue-50 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"><i className="fas fa-cloud-upload-alt"></i></div><p className="font-bold text-slate-600 text-sm">Klik atau tarik file PDF ke sini</p><p className="text-xs text-slate-400 mt-1">Maksimal 5MB</p></div>}
              </div>
            </div>
          </div>
          <div className="pt-4 border-t border-slate-100 flex justify-end">
            <button type="submit" disabled={load} className="px-8 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-500/25 hover:opacity-90 transition-all disabled:opacity-60 flex items-center gap-2.5">
              {load?<><i className="fas fa-spinner fa-spin"></i>Memproses...</>:<><i className="fas fa-paper-plane"></i>Kirim Pengajuan</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
};

            <button className="md:hidden w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200" onClick={()=>setSideOpen(!sideOpen)}><i className="fas fa-bars text-sm"></i></button>
            <div>
              <div className="flex items-center gap-2"><span className="w-1 h-5 bg-blue-600 rounded-full"></span><h2 className="text-base font-black text-slate-800">{LABELS[tab]||tab}</h2></div>
              <p className="text-[10px] text-slate-400 ml-3 mt-0.5">{new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden md:flex items-center gap-2 text-xs text-slate-400 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"><i className="fas fa-database text-slate-300"></i><span>{presensi.length} data</span></div>
            <button onClick={fetchData} disabled={load} className={`w-9 h-9 rounded-xl border flex items-center justify-center transition-all ${load?'bg-blue-50 border-blue-200 text-blue-600':'bg-white border-slate-200 text-slate-400 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-600'}`}>
              <i className={`fas fa-sync-alt text-sm ${load?'fa-spin':''}`}></i>
            </button>
          </div>
        </header>
        <div className="flex-1 overflow-auto p-4 md:p-6">
          {load&&presensi.length===0&&tab!=='pegawai'
            ? <div className="h-full flex flex-col items-center justify-center gap-5"><div className="loader border-4 border-blue-100 border-t-blue-600 rounded-full w-14 h-14"></div><div className="text-center"><span className="text-slate-700 font-black text-lg block">Menghubungkan ke Server...</span><span className="text-slate-400 text-sm mt-1 block">Sedang sinkronisasi data</span></div></div>
            : <div className="max-w-7xl mx-auto">
                {tab==='dashboard'            && <Dashboard presensiData={enriched} ijinData={ijin} pegawaiData={pegawai} />}
                {tab==='monitoring_presensi'  && <MonitoringPresensi data={enriched} refreshData={fetchData} userRole={user.role} userLembaga={uLembaga} />}
                {tab==='dokumen_ijin'         && <DokumenIjin data={ijin} refreshData={fetchData} userRole={user.role} userLembaga={uLembaga} />}
                {tab==='pengajuan_psw'        && <PengajuanPSW user={user} />}
                {tab==='pegawai'&&canPegawai  && <DatabasePegawai refreshParent={fetchData} userRole={user.role} />}
                {tab==='monitoring_export'    && <MonitoringExport presensiData={enriched} ijinData={ijin} pegawaiData={pegawai} refreshData={fetchData} userRole={user.role} />}
                {tab==='activity'             && <ActivityLog userRole={user.role} />}
              </div>
          }
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
